[workspace]

[package]
name = "breathe-retirada-ci"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "retirada's spot-reclaim signal applied to job-shaped (CI) workloads: classify a GH Actions job stuck in the queue with zero runner ever assigned as real capacity starvation vs a normal cold-start Wake, and (only past a confirmed, algorithmically-adjusting threshold) redispatch that one job -- bounded by a stateless retry ceiling read from GitHub's own run history. Vendored verbatim from pleme-io/breathe's breathe-retirada-ci crate (both repos private, no cross-repo PAT introduced -- see .github/workflows/retirada-ci-watch.yml for the deployment-specific caveats this port carries for pangea-operator)."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
# The real GithubJobQueueObserver/GithubWorkflowDispatcher impls + the
# `retirada-ci-watch` CLI binary -- typed GH REST API client, no shell.
octocrab = { version = "0.44", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"], optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[features]
# The real, network-touching CLI. Off by default so the typed decision
# core (the library) stays a zero-network, zero-octocrab dependency for
# anything that just wants classify()/classify_queue_starvation().
watch-cli = ["dep:octocrab", "dep:tokio", "dep:clap", "dep:tracing-subscriber"]

[[bin]]
name = "retirada-ci-watch"
path = "src/bin/watch.rs"
required-features = ["watch-cli"]

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[lints.clippy]
all = "warn"
