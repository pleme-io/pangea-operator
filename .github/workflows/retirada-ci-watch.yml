name: retirada-ci-watch

# Shim onto substrate's reusable. The mechanism moved there; the EVIDENCE that
# justified wiring this repo stays here, which is the right split — three
# copies of this workflow existed with byte-identical steps and three different
# incident write-ups, and the prose is what made them look unlike each other.
#
# Watches for jobs STARVED on camelot-builder-pleme-eks: queued with no runner
# ever assigned until GitHub's 24h queue timeout gives up. Confirmed 2026-07-23
# against two real incidents; the failure mode is starvation, not a mid-job
# spot reclaim.
#
# dry-run stays true: this repo has no on-demand-fallback input to redispatch
# onto yet.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: retirada-ci-watch
  cancel-in-progress: false

jobs:
  watch:
    if: github.repository == 'pleme-io/pangea-operator'
    uses: pleme-io/substrate/.github/workflows/retirada-ci-watch.yml@main
    with:
      watch-repo: pleme-io/pangea-operator
      watch-workflow: release.yml
    secrets: inherit
