name: arc-smoke
# Direct runs-on (no reusable workflow) to isolate ARC scale-set dispatch.
#
# runner ADDED 2026-07-26: previously targeted `rio-build-01` -- rio is
# permanently retired (2026-07-20 operator decision, not coming back), so
# that runner was dead and this smoke test could never pass. Repointed at
# the live self-hosted pool this repo's other workflows already use.
#
# ── ★ VALID TODAY, MEANINGLESS AFTER THE PUBLIC FLIP ────────────────────
# MEASURED 2026-08-06 (anonymous GitHub API: `/repos/pleme-io/pangea-operator`
# returns 404 while `/repos/pleme-io/breathe` returns 200): this repo is
# PRIVATE. So this probe works as intended and is left ENABLED.
#
# It must be RETIRED when the repo goes public, and the reason is structural
# rather than a preference: GitHub never assigns a public repository's jobs
# to a self-hosted runner (a fork PR could otherwise execute arbitrary code
# on the cluster), and this job's entire purpose is to prove the self-hosted
# ARC scale set dispatches. On a public repo it cannot succeed by
# construction — dispatched, it would queue forever: never failing, never
# alerting, indistinguishable from "still starting".
#
# To retire it then: replace `workflow_dispatch: {}` below with `{}` (an
# `on:` with no triggers keeps the file and offers no Run button). Do NOT
# repoint it at a hosted runner — that would make it pass while testing
# nothing, which is worse than an absent test.
#
# An earlier edit today retired it prematurely, on the mistaken belief the
# repo was already public. Reverted; the measurement above is the reason.
on:
  workflow_dispatch: {}
jobs:
  smoke:
    runs-on: camelot-builder-pleme-eks
    steps:
      - run: |
          echo "hello from the rio ARC self-hosted runner"
          hostname; uname -a; nproc; free -h || true
