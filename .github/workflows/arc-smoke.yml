name: arc-smoke
# Direct runs-on (no reusable workflow) to isolate ARC scale-set dispatch.
#
# runner ADDED 2026-07-26: previously targeted `rio-build-01` -- rio is
# permanently retired (2026-07-20 operator decision, not coming back), so
# that runner was dead and this smoke test could never pass. Repointed at
# the live self-hosted pool this repo's other workflows already use.
#
# ── ★ RETIRED 2026-08-06 — THIS TEST CANNOT PASS ON A PUBLIC REPO ────────
# This repo is PUBLIC, and GitHub never assigns a public repository's jobs
# to a self-hosted runner (a fork PR could otherwise execute arbitrary code
# on the cluster). This job's ENTIRE PURPOSE is to prove the self-hosted ARC
# scale set dispatches — so on a public repo it cannot succeed by
# construction. Dispatched, it would queue forever: never failing, never
# alerting, indistinguishable from "still starting".
#
# It is DISABLED, not deleted (★★ MODULARIZE, DON'T DELETE) — the runner
# label, the probe body and the rio history above stay intact, so if this
# repo ever goes private again the retirement is one line to reverse rather
# than a rebuild from memory.
#
# `workflow_dispatch` was already its only trigger, so nothing scheduled or
# push-driven changes; this only stops a manual dispatch from parking a job
# in the queue indefinitely.
on:
  # RETIRED: re-add `workflow_dispatch: {}` to revive (see the block above).
  # An `on:` with no triggers is what makes the workflow undispatchable —
  # GitHub keeps the file, offers no Run button, and starts nothing.
  {}
jobs:
  smoke:
    # Unreachable while `on:` declares no trigger. Kept verbatim so a revival
    # needs no reconstruction.
    runs-on: camelot-builder-pleme-eks
    steps:
      - run: |
          echo "hello from the rio ARC self-hosted runner"
          hostname; uname -a; nproc; free -h || true
