name: manual-image-build-temp

# TEMPORARY, ONE-OFF workflow — NOT part of the standing release pipeline.
#
# Why this exists: release.yml's `image` job is pinned to `runner:
# rio-build-01` (the rio homelab self-hosted box). rio has been offline
# ~3 days per Tailscale (zero registered self-hosted runners at org/repo
# level; the prior two `release` runs have sat `queued` for 20+ hours).
# The JIT `quero-builders-x86_64-asg` AWS fallback was separately
# decommissioned (see pleme-io/nix nodes/cid/pangea-builder.nix). This
# workflow reuses the SAME `pleme-io/substrate/.github/workflows/
# image-push.yml` reusable — same imageAttr, same buildCores/maxJobs
# anti-OOM tuning — just dispatched on a GitHub-hosted `ubuntu-24.04`
# runner (native x86_64, no cross-compilation) instead of rio, as a
# one-time fallback to ship a production bug fix
# (docs/postmortems/2026-07-12-camelot-eks-state-wipe-duplicate-vpc.md)
# while rio is down. Delete this file once the image has published
# (success or failure) — it is not meant to become a second standing
# release path.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  image:
    name: container image → ghcr.io (fallback GH-hosted runner)
    uses: pleme-io/substrate/.github/workflows/image-push.yml@main
    with:
      imageAttr: dockerImage-operator-embedded-amd64
      imageName: pleme-io/pangea-operator
      # Continues the real sequence (latest published was r97,
      # 2026-07-09T03:55:26Z, commit f99242c) — this build carries the
      # 71bbfb7 state-wipe + stale-plan-hash fix.
      tag: embedded-amd64-r98-71bbfb73b9f01c513b265655b7f5a43fc18eedb9
      additionalTags: latest-embedded-amd64
      runner: ubuntu-24.04
      buildCores: "1"
      maxJobs: "1"
    secrets:
      GHCR_TOKEN: ${{ secrets.BOT_PAT }}
