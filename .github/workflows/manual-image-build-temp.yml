name: manual-image-build-temp

# TEMPORARY, ONE-OFF workflow — NOT part of the standing release pipeline.
#
# Why this exists: release.yml's `image` job is pinned to `runner:
# rio-build-01` (the rio homelab self-hosted box). Confirmed still
# offline this session (`gh api repos/pleme-io/pangea-operator/actions/
# runners` returns zero registered runners at all) — the same condition
# that motivated this exact fallback for r98/r99. This workflow reuses
# the SAME `pleme-io/substrate/.github/workflows/image-push.yml`
# reusable — same imageAttr, same buildCores/maxJobs anti-OOM tuning —
# just dispatched on a GitHub-hosted `ubuntu-24.04` runner (native
# x86_64, no cross-compilation) instead of rio, as a one-time fallback
# to ship a production bug fix (the plan-approval-hash non-determinism
# that livelocked camelot-eks's Planning phase — pangea-operator@e62e3b4
# + fc2b597) while rio is down. Delete this file once the image has
# published (success or failure) — it is not meant to become a second
# standing release path.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  image:
    name: container image → ghcr.io (fallback GH-hosted runner)
    uses: pleme-io/substrate/.github/workflows/image-push.yml@main
    with:
      imageAttr: dockerImage-operator-embedded-amd64
      imageName: pleme-io/pangea-operator
      # Continues the real sequence (latest published was r99,
      # 2026-07-12, commit c7797fe) — this build carries the
      # canonical_drift_fingerprint plan-hash-determinism fix.
      tag: embedded-amd64-r100-fc2b5972e1dda7d85da2e3a58d2b7aa40cd5a803
      additionalTags: latest-embedded-amd64
      runner: ubuntu-24.04
      buildCores: "1"
      maxJobs: "1"
    secrets:
      GHCR_TOKEN: ${{ secrets.BOT_PAT }}
