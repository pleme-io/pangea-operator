name: release

# AUTO-RELEASE (★★ org directive): the embedded operator image ships on every
# MERGE TO MAIN, tagged `embedded-amd64-<sha>` (the HelmRelease + Flux
# ImagePolicy convention). Binaries + chart still publish on a v* tag.
#
# ── Runner resilience (hardened 2026-07-16, corrected 2026-07-17, RETARGETED
#    TO MODE-3 2026-07-19) ───────────────────────────────────────────────────
# The 2026-07-16 pass added a `workflow_dispatch` escape hatch but left the
# PUSH-triggered (i.e. every real auto-release merge) default pointed at
# `rio-build-01` -- a push event has no `inputs` context at all, so
# `inputs.runner || 'rio-build-01'` always resolved to the dead literal for
# the one trigger that actually matters. Confirmed live 2026-07-17: 11
# consecutive push-triggered runs sat permanently `queued` against
# `rio-build-01`, which has 0 registered runners fleet-wide.
#
# The 2026-07-17 pass moved the default to `camelot-builder-pleme` (Mode-1,
# akeyless-k8s/clusters/camelot-mode1/infrastructure/ci/runner-scale-set-pleme.yaml).
# That pool's sole node went NotReady/Unreachable 2026-07-17T18:19 and was
# never replaced (its own self-healing InfrastructureTemplate,
# camelot-builder-pool, sat suspend:true) -- 28+ consecutive runs stuck
# queued, root-caused 2026-07-19, the same day Mode-1 was decided to be
# retired entirely (fleet-wide Mode-1 -> Mode-3/EKS consolidation).
#
# RETARGETED 2026-07-19: the default now points at `camelot-builder-pleme-eks`
# -- the direct Mode-3/EKS clone of the same pool (akeyless-k8s/clusters/
# camelot-eks/infrastructure/ci/runner-scale-set-pleme.yaml), ported 2026-07-17
# for exactly this reason and confirmed live + Ready (HelmRelease
# Released=True, ExternalSecret synced, chart-version-locked to the shared
# arc-controller at 0.12.1). Same shape as Mode-1's pool in every load-bearing
# way: registers against `githubConfigUrl: https://github.com/pleme-io` into
# the org's unrestricted `Default` runner group, so every pleme-io repo
# (this one included) targets it by name with no per-repo grant; 100%-spot,
# scale-to-zero. Real concurrency today is closer to ~3 runners (one
# t3.large node's worth) than the pool's eventual ceiling -- breathe's own
# elastic scale-out for this nodegroup is only partially wired (a separate,
# tracked gap) -- so expect some queueing under load until that lands, not
# permanent starvation the way Mode-1's dead node was.
#
# BONUS, not just parity: this also activates `extraSubstituters` below,
# which was wired but a silent no-op on Mode-1 (camelot-eks's sui cache is
# only reachable from inside camelot-eks's own network) -- a build on
# camelot-builder-pleme-eks gets real substitute-cache benefit for the
# first time.
#
# 1. `runner` is still a `workflow_dispatch` input, now defaulting to
#    `camelot-builder-pleme-eks` to match the push-triggered default (kept
#    in lockstep so a blank manual dispatch behaves identically to a push).
#    An operator can still retarget a one-off run to `rio-build-01` (to pick
#    up its Attic cache) or `ubuntu-latest` (to rule out the ARC pool
#    entirely) without editing this file.
# 2. The `rio:8080` Attic substituter is rio's OWN LAN-local cache --
#    unreachable from anywhere but rio's own network. It stays gated on
#    `runner == 'rio-build-01'` exactly as before, so it only ever fires on
#    an explicit manual override back to rio.
#
# Recovery path when camelot-builder-pleme-eks itself is unavailable: check
# `akeyless-k8s/clusters/camelot-eks/infrastructure/ci/runner-scale-set-pleme.yaml`
# + its sibling `arc-controller` Kustomization are Ready via the
# fluxcd-camelot-eks MCP, or fall back to `workflow_dispatch` with
# `runner: ubuntu-latest` for a one-off unblock -- this workflow cannot
# reconcile cluster state from here, only degrade around the outage.
#
# ── No inline conditionals in the config values (hardened same pass) ──────
# A `${{ cond && 'a' || 'b' }}` ternary repeated per-field is fragile: the
# condition drifts out of sync the moment one call site changes and not the
# others (caught live -- an earlier draft of this exact fix had exactly that
# bug). GHA's own struct-merge primitive (YAML `<<:` anchors) does NOT work
# around this -- confirmed empirically via actionlint, which mirrors GH's
# real parser: a merged-in job silently loses the anchored fields entirely
# (YAML 1.2 dropped merge-key support from the core spec; GHA's parser
# doesn't reinstate it). So instead of one job with conditional fields, this
# is TWO fully static job variants (`image-rio` / `image-fallback`), each a
# flat struct with no `&&`/`||` anywhere in its `with:` block -- the ONLY
# conditional in the whole file is the single `if:` flag on each job
# choosing which struct actually runs. `resolve-runner` still computes that
# one flag from `inputs.runner` (unavoidable -- something has to decide),
# but nothing downstream re-derives or repeats that decision.
#
# `secrets: inherit` is required -- reusable workflows don't auto-inherit
# the caller's secrets (GHA quirk).

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0); informational — Chart.yaml is source of truth'
        required: false
      runner:
        description: 'Override the image-build runner label (e.g. rio-build-01 to pick up its Attic cache, or ubuntu-latest to rule out camelot-builder-pleme-eks).'
        required: false
        # The YAML-native single source of truth for the default runner --
        # a manual dispatch that leaves this blank resolves to this value
        # AT THE INPUT LEVEL (visible in the GH UI, not buried in an
        # expression). A `push` trigger has no `inputs` block at all, so
        # resolve-runner's `|| 'camelot-builder-pleme-eks'` below still
        # carries the same literal for that path -- GHA expression strings
        # are opaque to YAML anchors/aliases (confirmed: an alias can't be
        # spliced into the middle of a `${{ }}` string), so a second
        # occurrence for the push-trigger case is the actual floor here,
        # not a missed DRY-up.
        default: camelot-builder-pleme-eks

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  # The single source of truth for "which runner" and "does it get rio's
  # LAN-local cache" -- computed once via pure GHA expressions (no shell),
  # consumed via `needs.resolve-runner.outputs.*` by every job below. A
  # `with:` block for a reusable-workflow call can read `needs` and
  # `inputs` directly (confirmed via actionlint's context-availability
  # error) but NOT a top-level `env:` -- this job exists because that path
  # doesn't exist in GHA, not out of unnecessary indirection.
  resolve-runner:
    name: resolve build runner
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ inputs.runner || 'camelot-builder-pleme-eks' }}
      # rio's Attic cache is reachable ONLY from rio's own LAN, so it is
      # only ever wired up when the target is EXPLICITLY rio-build-01 (a
      # manual override) -- the default (camelot-builder-pleme-eks) and any
      # other override (e.g. ubuntu-latest) both skip it.
      use-rio-cache: ${{ inputs.runner == 'rio-build-01' }}
    steps:
      - run: echo "runner=${{ inputs.runner || 'camelot-builder-pleme-eks' }}"

  # The image ships on every merge — the auto-release path. Two flat,
  # static variants (never both); `resolve-runner`'s single boolean output
  # picks which one runs, and neither variant's `with:` block contains a
  # conditional field. `image-rio` is now the NON-DEFAULT variant — it only
  # runs on an explicit `workflow_dispatch` override back to `rio-build-01`
  # (see the top-of-file comment); every push-triggered merge takes
  # `image-fallback` onto `camelot-builder-pleme-eks`.
  #
  # rio-build-01 is a single homelab node (~13Gi free). The embedded build
  # compiles native ruby gems (nio4r, puma, …) + Rust crates from source (no
  # binary cache serves the pleme gem builds without the Attic substituter
  # below). At maxJobs:2 nix ran several native compiles CONCURRENTLY and
  # the aggregate peak RAM OOM-killed the build (signal 9) — twice, on r38.
  # SERIALIZE the build: maxJobs:1 means one derivation at a time, so peak
  # RAM is the single largest compile, well under node memory. cores:1 (was
  # 2): even at maxJobs:1 the SINGLE rust_pangea-operator crate compile
  # (codegen-units=1 + LTO + the embedded-ruby/magma binary) is one
  # memory-heavy rustc that OOM-killed (signal 9) on r40 under load; cores:1
  # makes that rustc single-threaded → lowest peak RAM regardless of node.
  # Both settings are kept on the fallback variant too -- camelot-builder-
  # pleme-eks's runner pod caps at 6Gi (akeyless-k8s clusters/camelot-eks/
  # infrastructure/ci/runner-scale-set-pleme.yaml
  # template.spec.containers[0].resources.limits.memory), TIGHTER than
  # rio's ~13Gi, so the same OOM risk applies there and cores:1/maxJobs:1
  # is the load-bearing mitigation, not a rio-specific tune. Unverified
  # empirically on camelot-builder-pleme-eks as of this retarget — watch
  # the first few real runs on this pool for signal-9 exits; if it OOMs
  # even at cores:1, the fix is a runner-pod memory bump in that same
  # runner-scale-set-pleme.yaml, not a further squeeze here.
  image-rio:
    name: container image → ghcr.io (rio, manual override only)
    needs: resolve-runner
    if: needs.resolve-runner.outputs.use-rio-cache == 'true'
    uses: pleme-io/substrate/.github/workflows/image-push.yml@main
    with:
      imageAttr: dockerImage-operator-embedded-amd64
      imageName: pleme-io/pangea-operator
      # `r<run_number>` makes the tag sortable by recency for Flux ImagePolicy
      # (a git sha alone isn't orderable); the sha keeps it traceable.
      tag: embedded-amd64-r${{ github.run_number }}-${{ github.sha }}
      additionalTags: latest-embedded-amd64
      runner: rio-build-01
      buildCores: "1"
      maxJobs: "1"
      # Attic binary cache on rio's OWN LAN -- resolvable only from rio's own
      # network, so this variant ONLY ever runs when the target IS rio (the
      # `if:` above). tend prebuilds fleet closures into the `nexus` cache;
      # pulling from it lets the heavy deps (ruby, native gems, magma,
      # common crates) SUBSTITUTE instead of compiling cold. Read-only
      # token, mounted as a netrc on the runner (SOPS secret arc-attic-netrc).
      extraSubstituters: "http://rio:8080/nexus"
      extraTrustedPublicKeys: "nexus:aZ0dDIXpfD1fIzN4z9waAWim7R8paT1qZhxQydlUZ90="
      netrcFile: "/etc/attic/netrc"
      # Pre-publish CVE gate (fixed here 2026-07-19 -- see the standalone
      # cve-scan job's old header comment, now removed, for the incident).
      # image-push.yml scans the LOCAL image.tar.gz BEFORE the push step
      # runs; a CRITICAL/HIGH/... finding fails the job here and "Push image"
      # never executes, so a vulnerable tag can never reach ghcr.io, and
      # Flux's ImagePolicy/ImageUpdateAutomation (★ AUTOBUMP) can never poll
      # it. Same threshold + exception file the old post-publish job used.
      scanBeforePush: true
      scanFailOnSeverity: "UNKNOWN"
      scanIgnoreFile: ".trivyignore"
    secrets:
      # BOT_PAT carries write:packages for ghcr.io/pleme-io/* — the proven
      # ghcr-push token (matches caixa-/helm-auto-release.yml). `secrets: inherit`
      # passes it only as secrets.BOT_PAT, but image-push expects GHCR_TOKEN, so it
      # fell back to GITHUB_TOKEN — which lacks package-write on this org package
      # (push failed: permission_denied: write_package). Map it explicitly.
      GHCR_TOKEN: ${{ secrets.BOT_PAT }}

  # The DEFAULT variant for every push-triggered merge: no rio-local cache
  # (unreachable off rio's LAN), runner is `camelot-builder-pleme-eks`
  # unless overridden. Warm build -- camelot-eks's own sui cache substituter
  # is reachable from this pool (see extraSubstituters below), unlike
  # Mode-1's now-retired pool.
  image-fallback:
    name: container image → ghcr.io (camelot-builder-pleme-eks / override)
    needs: resolve-runner
    if: needs.resolve-runner.outputs.use-rio-cache != 'true'
    uses: pleme-io/substrate/.github/workflows/image-push.yml@main
    with:
      imageAttr: dockerImage-operator-embedded-amd64
      imageName: pleme-io/pangea-operator
      tag: embedded-amd64-r${{ github.run_number }}-${{ github.sha }}
      additionalTags: latest-embedded-amd64
      runner: ${{ needs.resolve-runner.outputs.runner }}
      buildCores: "1"
      maxJobs: "1"
      # Camelot's in-cluster sui binary-cache (theory/ATATAME.md's "sui cache
      # serve" L1 origin, deployed camelot-eks/infrastructure/sui) -- the same
      # two-field wiring breathe/image.yml already ships. Only reachable from
      # an ARC pod genuinely inside camelot-eks's own network (its NetworkPolicy
      # gates ingress on pleme.io/estrato=build); a GitHub-hosted runner or a
      # Mode-1 pod can't resolve this Kubernetes-internal hostname, so on
      # those targets it's a harmless no-op (nix substituters fail open).
      # ACTIVATED 2026-07-19: the default runner above is now
      # camelot-builder-pleme-eks (Mode-1's pool retired), so this is no
      # longer a parity-only no-op -- builds on the default path now get
      # real substitute-cache benefit from sui. pending-camelot-cache: task
      # #20 tracked the runner-label half of this; that half is done, the
      # rest of #20 (broader fleet-wide cache coverage) remains open.
      extraSubstituters: ${{ vars.CAMELOT_SUI_SUBSTITUTER }}
      requireSigs: ${{ vars.CAMELOT_SUI_REQUIRE_SIGS }}
      # Pre-publish CVE gate -- same rationale as image-rio above. This is
      # the variant every real push-triggered merge actually takes (the
      # default runner), so this is the load-bearing half of the fix.
      scanBeforePush: true
      scanFailOnSeverity: "UNKNOWN"
      scanIgnoreFile: ".trivyignore"
    secrets:
      GHCR_TOKEN: ${{ secrets.BOT_PAT }}

  # ── The standalone post-publish cve-scan job that used to live here is
  # REMOVED (2026-07-19) — root cause + fix history below.
  #
  # Found live 2026-07-14: this pipeline had never once scanned its own
  # published artifact. A direct image-scan call was added as a JOB AFTER
  # image-rio/image-fallback, scanning the tag those jobs had ALREADY
  # pushed to ghcr.io. Promoted from advisory (continue-on-error) to a real
  # blocking gate 2026-07-17 -- but "blocking" here only ever meant it
  # turned THIS WORKFLOW RUN red; it could never un-publish the image that
  # was already live. Confirmed live 2026-07-19 (tag embedded-amd64-r174):
  # a build whose post-publish scan FAILED (CRITICAL) still had its tag
  # picked up by Flux's ImagePolicy/ImageUpdateAutomation (★ AUTOBUMP)
  # within minutes and ran in-cluster for ~1.5h before the next (clean)
  # build superseded it -- the gate was a receipt, not a gate, by
  # construction: nothing in the CI graph or in Flux's registry poll ever
  # depended on this job's result.
  #
  # The fix moves the SAME scan (same threshold `UNKNOWN`, same
  # `.trivyignore`) into pleme-io/substrate's image-push.yml reusable
  # itself, BETWEEN the local build step and the push step (its
  # `scanBeforePush` input, opted into by image-rio/image-fallback above).
  # A failing scan now stops image-push.yml's own job before "Push image"
  # runs -- the vulnerable tag never reaches ghcr.io, so there is nothing
  # for Flux to poll. This also fixes every OTHER consumer of
  # image-push.yml fleet-wide, not just this repo (the org's own
  # solve-once-in-one-place doctrine) -- opt-in via the same three inputs.

  # Binaries + chart publish on a version tag (or manual dispatch) — not on
  # every merge.
  #
  # ── Cross-arch libruby gap (fixed here, 2026-07-19) ────────────────────
  # This job used to call the shared pleme-io/substrate/rust-binary-release.yml
  # reusable directly with no `features`/`no-default-features` override, so
  # every one of its 4 matrix legs compiled pangea-operator's Cargo.toml
  # DEFAULT features -- which include `embedded_ruby` (pangea-ruby-eval ->
  # magnus -> rb-sys, linking libruby via FFI). rb-sys's build script
  # discovers Ruby via the HOST's `ruby`/RbConfig, so it always resolves to
  # whatever Ruby ships on the runner's NATIVE architecture -- macos-latest
  # is Apple-Silicon (arm64) native, ubuntu-latest is x86_64 native. For the
  # two legs matching the runner's native arch (macos aarch64-apple-darwin,
  # linux x86_64-unknown-linux-gnu) that's correct and they link fine
  # (confirmed live, run 29670319134). For the two CROSS legs (macos
  # x86_64-apple-darwin, linux aarch64-unknown-linux-gnu) rb-sys still
  # points the linker at the NATIVE-arch libruby -- no matching cross-arch
  # libruby exists anywhere on these generic GH-hosted runners, so the link
  # fails: "ld: symbol(s) not found for architecture x86_64" on macOS,
  # "cannot find -lruby-3.2" on the aarch64-linux cross-linker (same run).
  # This is NOT a Nix/flake.nix problem -- this job never touches Nix at all
  # (plain dtolnay/rust-toolchain + cargo build); flake.nix's
  # mkEmbeddedOperatorImage solves cross-arch Ruby correctly, but only for
  # the embedded-ruby DOCKER image (via nixpkgs' own cross-compiled
  # `ruby_3_3`), and that machinery is entirely separate from this
  # cargo-only job.
  #
  # The genuine load-bearing fix -- teaching pleme-io/actions/rust-cross-build
  # (or the substrate rust-binary-release.yml reusable) to provision a real
  # cross-arch Ruby (an aarch64 ruby-dev sysroot on the ubuntu cross leg, a
  # Rosetta/ruby-build x86_64 Ruby on the macOS leg) -- belongs upstream in
  # those shared, multi-consumer repos and needs its own careful pass (most
  # other consumers don't need Ruby at all; getting the toolchain wrong
  # risks breaking them). Out of scope here.
  #
  # The fix landed HERE is scoped to this repo only. The shared reusable's
  # `features`/`no-default-features` inputs apply ONE pair to its WHOLE
  # matrix, so there is no way to special-case just the 2 cross legs through
  # it -- this job inlines the same 4-leg matrix directly and calls
  # `pleme-io/actions/rust-cross-build@v1` (the same composite action the
  # reusable itself delegates to) per leg, passing `no-default-features:
  # true` + `features: "graphql grpc executor_magma"` (everything except
  # embedded_ruby) ONLY on the 2 cross legs. The 2 native legs are
  # unaffected -- full default features, exactly as before. A cross-arch
  # binary without embedded_ruby is not a regression: the feature has a
  # documented graceful-degradation path (falls back to the pangea-compiler
  # HTTP sidecar -- see pangea-operator/Cargo.toml's `embedded_ruby` doc
  # comment), and was in fact the default shape before 2026-06-02.
  binaries:
    name: cross-arch binaries → GH Release
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, suffix: linux-x86_64, no-default-features: "false", features: "" }
          # cross leg -- no aarch64 libruby available; drop embedded_ruby (see comment above)
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, suffix: linux-aarch64, no-default-features: "true", features: "graphql grpc executor_magma" }
          # cross leg -- macos-latest is arm64 native, no x86_64 libruby available; drop embedded_ruby
          - { os: macos-latest, target: x86_64-apple-darwin, suffix: macos-x86_64, no-default-features: "true", features: "graphql grpc executor_magma" }
          - { os: macos-latest, target: aarch64-apple-darwin, suffix: macos-aarch64, no-default-features: "false", features: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compiler (linux aarch64 only)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Configure cross-linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build + stage
        uses: pleme-io/actions/rust-cross-build@v1
        with:
          binary-name: pangea-operator
          target: ${{ matrix.target }}
          suffix: ${{ matrix.suffix }}
          features: ${{ matrix.features }}
          no-default-features: ${{ matrix.no-default-features }}

      - name: Attach binaries to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pangea-operator-${{ matrix.suffix }}
            dist/pangea-operator-${{ matrix.suffix }}.sha256

  # ── Helm chart job (fixed here, 2026-07-19) ────────────────────────────
  # pleme-io/actions/helm-oci-publish@v1 is a `runs: using: docker` action
  # (docker://ghcr.io/pleme-io/action-helm-oci-publish:latest) -- its own
  # entrypoint script (run.tlisp) opens with `(exec-ok? "nix" "run" ".#forge"
  # "--" "--help")`, and its own doc comment states the precondition "Nix
  # already installed" -- but that image ships with no `nix` binary on
  # PATH, so every invocation fails immediately: "tatara-script: error: in
  # native `exec-ok?`: No such file or directory (os error 2)" (confirmed
  # live, run 29670319134). helm-publish.yml (the calling reusable, in
  # pleme-io/substrate) DOES install Nix first via
  # DeterminateSystems/nix-installer-action -- but that lands on the HOST
  # runner, and a `docker`-type action always executes inside its OWN,
  # separately-built container image; nothing installed on the host is
  # visible inside it. So "install nix before it" cannot fix this from the
  # calling side by adding a step ahead of the SAME docker action -- the
  # real fix is baking `nix` into
  # ghcr.io/pleme-io/action-helm-oci-publish:latest itself, which belongs
  # upstream in pleme-io/actions (a shared, multi-consumer image) and needs
  # its own careful pass. Out of scope here.
  #
  # The workaround landed HERE stays scoped to this repo: it no longer
  # calls the shared helm-chart-release.yml / helm-publish.yml reusables
  # (their `publish` job IS the broken docker-action call) or the broken
  # docker image at all. It installs Nix on the HOST (the same
  # DeterminateSystems/nix-installer-action step helm-publish.yml already
  # used -- it puts `nix` on PATH for every later step in the SAME job) and
  # then runs helm-oci-publish's own run.tlisp -- copied verbatim below, not
  # reimplemented -- via the COMPOSITE `pleme-io/actions/tatara-script@v1`
  # action, which executes on the host runner rather than inside a
  # container. run.tlisp already supports this exact invocation shape (its
  # own doc comment: "Docker mode preferred; bare names retained as
  # composite fallback"); this repo's flake has no `.#forge` app, so
  # `forge-available?` is false here and the plain `helm lint && helm
  # package && helm push` fallback path runs -- exactly what would have run
  # inside the container had it not been missing nix. Once
  # ghcr.io/pleme-io/action-helm-oci-publish:latest bakes in nix upstream,
  # this job can revert to `uses:
  # pleme-io/substrate/.github/workflows/helm-chart-release.yml@main`.
  chart:
    name: Helm chart → ArtifactHub OCI
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Derive chart version from tag
        id: derive
        uses: pleme-io/actions/derive-version-from-tag@v1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      # Ported verbatim from pleme-io/substrate's helm-publish.yml (this
      # exact step already ran successfully in the failing run being
      # fixed here -- "Login Succeeded" -- it is the Nix install that runs
      # ahead of it, not this step itself, that had never landed in a
      # pangea-operator-local job before).
      - name: Registry login
        env:
          REGISTRY: oci://ghcr.io/pleme-io/pangea-operator/charts
          TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN || github.token }}
        run: |
          set -euo pipefail
          host="${REGISTRY#oci://}"
          host="${host%%/*}"
          echo "$TOKEN" | nix shell nixpkgs#kubernetes-helm --command \
            helm registry login "$host" --username "${{ github.actor }}" --password-stdin

      # Verbatim copy of pleme-io/actions/helm-oci-publish/run.tlisp
      # (2026-07-19) -- see the job comment above for why it runs here,
      # via tatara-script on the host, instead of through the broken
      # docker action.
      - name: Lint, package & push chart
        uses: pleme-io/actions/tatara-script@v1
        with:
          script: |
            ;; helm-oci-publish/run.tlisp — lint + package + push a Helm chart.
            ;;
            ;; Tries `nix run .#forge -- helm release ...` first; falls back to
            ;; `nix shell nixpkgs#kubernetes-helm` for lint/package/push if forge
            ;; isn't exposed in the consumer's flake.
            ;;
            ;; Inputs (env):
            ;;   CHART_PATH      — path to the chart directory (must contain Chart.yaml)
            ;;   REGISTRY        — oci:// URL
            ;;   VERSION         — optional override; empty means "use Chart.yaml's version"
            ;;   LIB_CHART_DIR   — optional sibling library chart dir (for file:// deps)
            ;;   LIB_CHART_NAME  — library chart name (default "pleme-lib")
            ;;
            ;; Pre-condition: helm registry login already done by the caller
            ;; workflow (the docker/login-equivalent for OCI Helm). Nix already
            ;; installed.

            ;; INPUT_* (Docker mode) preferred; bare names retained as composite fallback.
            (define chart-path     (env-get "INPUT_CHART_PATH"     (env-get "CHART_PATH"     "")))
            (define registry       (env-get "INPUT_REGISTRY"       (env-get "REGISTRY"       "")))
            (define version        (env-get "INPUT_VERSION"        (env-get "VERSION"        "")))
            (define lib-chart-dir  (env-get "INPUT_LIB_CHART_DIR"  (env-get "LIB_CHART_DIR"  "")))
            (define lib-chart-name (env-get "INPUT_LIB_CHART_NAME" (env-get "LIB_CHART_NAME" "pleme-lib")))

            (when (or (equal? chart-path "") (equal? registry ""))
              (log-error "helm-oci-publish: missing INPUT_CHART_PATH or INPUT_REGISTRY")
              (exit 1))

            (define (forge-available?)
              (exec-ok? "nix" "run" ".#forge" "--" "--help"))

            (define (push-via-forge)
              ;; Build args list dynamically: --version and --lib-chart-dir are
              ;; only included when their inputs are non-empty.
              (define base (list "nix" "run" ".#forge" "--"
                                 "helm" "release"
                                 "--chart-dir" chart-path
                                 "--registry"  registry))
              (define with-version
                (if (equal? version "")
                  base
                  (append base (list "--version" version))))
              (define final
                (if (equal? lib-chart-dir "")
                  with-version
                  (append with-version
                          (list "--lib-chart-dir" lib-chart-dir
                                "--lib-chart-name" lib-chart-name))))
              (apply exec-check final))

            (define (helm-lint)
              (exec-check "nix" "shell" "nixpkgs#kubernetes-helm" "--command"
                          "helm" "lint" chart-path))

            (define (helm-package)
              ;; Always package into ./dist so a subsequent helm-push knows where
              ;; to look. If VERSION is empty, helm uses Chart.yaml's version.
              (exec-check "nix" "shell" "nixpkgs#kubernetes-helm" "--command"
                          "sh" "-c"
                          (string-append "mkdir -p dist && helm package " chart-path
                                         " --destination dist"
                                         (if (equal? version "") ""
                                             (string-append " --version " version)))))

            (define (helm-push)
              (exec-check "nix" "shell" "nixpkgs#kubernetes-helm" "--command"
                          "sh" "-c"
                          (string-append "tgz=$(ls -1 dist/*.tgz | head -n1) && "
                                         "helm push \"$tgz\" " registry)))

            (define (push-via-helm-cli)
              (define lint-status    (helm-lint))
              (cond
                ((not (= lint-status 0)) (exit lint-status))
                (else
                 (define pkg-status (helm-package))
                 (cond
                   ((not (= pkg-status 0)) (exit pkg-status))
                   (else (helm-push))))))

            (log-info (string-append "publishing " chart-path " -> " registry))

            (define status
              (if (forge-available?)
                (begin (log-info "using forge helm release") (push-via-forge))
                (begin (log-info "forge not in flake; using helm CLI") (push-via-helm-cli))))

            (when (not (= status 0))
              (log-error (string-append "helm publish failed (status "
                                        (string-format "{}" status) ")"))
              (exit status))

            (log-info "helm chart published")
        env:
          CHART_PATH: ./pangea-operator/charts/pangea-operator
          REGISTRY: oci://ghcr.io/pleme-io/pangea-operator/charts
          VERSION: ${{ steps.derive.outputs.version }}
          LIB_CHART_DIR: ""
          LIB_CHART_NAME: pleme-lib
