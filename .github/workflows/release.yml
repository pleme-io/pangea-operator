name: release

# AUTO-RELEASE (★★ org directive): the embedded operator image ships on every
# MERGE TO MAIN, tagged `embedded-amd64-<sha>` (the HelmRelease + Flux
# ImagePolicy convention). Binaries + chart still publish on a v* tag.
#
# ── Runner resilience (hardened 2026-07-16, corrected 2026-07-17, RETARGETED
#    TO MODE-3 2026-07-19) ───────────────────────────────────────────────────
# The 2026-07-16 pass added a `workflow_dispatch` escape hatch but left the
# PUSH-triggered (i.e. every real auto-release merge) default pointed at
# `rio-build-01` -- a push event has no `inputs` context at all, so
# `inputs.runner || 'rio-build-01'` always resolved to the dead literal for
# the one trigger that actually matters. Confirmed live 2026-07-17: 11
# consecutive push-triggered runs sat permanently `queued` against
# `rio-build-01`, which has 0 registered runners fleet-wide.
#
# The 2026-07-17 pass moved the default to `camelot-builder-pleme` (Mode-1,
# akeyless-k8s/clusters/camelot-mode1/infrastructure/ci/runner-scale-set-pleme.yaml).
# That pool's sole node went NotReady/Unreachable 2026-07-17T18:19 and was
# never replaced (its own self-healing InfrastructureTemplate,
# camelot-builder-pool, sat suspend:true) -- 28+ consecutive runs stuck
# queued, root-caused 2026-07-19, the same day Mode-1 was decided to be
# retired entirely (fleet-wide Mode-1 -> Mode-3/EKS consolidation).
#
# RETARGETED 2026-07-19: the default now points at `camelot-builder-pleme-eks`
# -- the direct Mode-3/EKS clone of the same pool (akeyless-k8s/clusters/
# camelot-eks/infrastructure/ci/runner-scale-set-pleme.yaml), ported 2026-07-17
# for exactly this reason and confirmed live + Ready (HelmRelease
# Released=True, ExternalSecret synced, chart-version-locked to the shared
# arc-controller at 0.12.1). Same shape as Mode-1's pool in every load-bearing
# way: registers against `githubConfigUrl: https://github.com/pleme-io` into
# the org's unrestricted `Default` runner group, so every pleme-io repo
# (this one included) targets it by name with no per-repo grant; 100%-spot,
# scale-to-zero. Real concurrency today is closer to ~3 runners (one
# t3.large node's worth) than the pool's eventual ceiling -- breathe's own
# elastic scale-out for this nodegroup is only partially wired (a separate,
# tracked gap) -- so expect some queueing under load until that lands, not
# permanent starvation the way Mode-1's dead node was.
#
# BONUS, not just parity: this also activates `extraSubstituters` below,
# which was wired but a silent no-op on Mode-1 (camelot-eks's sui cache is
# only reachable from inside camelot-eks's own network) -- a build on
# camelot-builder-pleme-eks gets real substitute-cache benefit for the
# first time.
#
# 1. `runner` is still a `workflow_dispatch` input, now defaulting to
#    `camelot-builder-pleme-eks` to match the push-triggered default (kept
#    in lockstep so a blank manual dispatch behaves identically to a push).
#    An operator can still retarget a one-off run to `rio-build-01` (to pick
#    up its Attic cache) or `ubuntu-latest` (to rule out the ARC pool
#    entirely) without editing this file.
# 2. The `rio:8080` Attic substituter is rio's OWN LAN-local cache --
#    unreachable from anywhere but rio's own network. It stays gated on
#    `runner == 'rio-build-01'` exactly as before, so it only ever fires on
#    an explicit manual override back to rio.
#
# Recovery path when camelot-builder-pleme-eks itself is unavailable: check
# `akeyless-k8s/clusters/camelot-eks/infrastructure/ci/runner-scale-set-pleme.yaml`
# + its sibling `arc-controller` Kustomization are Ready via the
# fluxcd-camelot-eks MCP, or fall back to `workflow_dispatch` with
# `runner: ubuntu-latest` for a one-off unblock -- this workflow cannot
# reconcile cluster state from here, only degrade around the outage.
#
# ── No inline conditionals in the config values (hardened same pass) ──────
# A `${{ cond && 'a' || 'b' }}` ternary repeated per-field is fragile: the
# condition drifts out of sync the moment one call site changes and not the
# others (caught live -- an earlier draft of this exact fix had exactly that
# bug). GHA's own struct-merge primitive (YAML `<<:` anchors) does NOT work
# around this -- confirmed empirically via actionlint, which mirrors GH's
# real parser: a merged-in job silently loses the anchored fields entirely
# (YAML 1.2 dropped merge-key support from the core spec; GHA's parser
# doesn't reinstate it). So instead of one job with conditional fields, this
# is TWO fully static job variants (`image-rio` / `image-fallback`), each a
# flat struct with no `&&`/`||` anywhere in its `with:` block -- the ONLY
# conditional in the whole file is the single `if:` flag on each job
# choosing which struct actually runs. `resolve-runner` still computes that
# one flag from `inputs.runner` (unavoidable -- something has to decide),
# but nothing downstream re-derives or repeats that decision.
#
# `secrets: inherit` is required -- reusable workflows don't auto-inherit
# the caller's secrets (GHA quirk).

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0); informational — Chart.yaml is source of truth'
        required: false
      runner:
        description: 'Override the image-build runner label (e.g. rio-build-01 to pick up its Attic cache, or ubuntu-latest to rule out camelot-builder-pleme-eks).'
        required: false
        # The YAML-native single source of truth for the default runner --
        # a manual dispatch that leaves this blank resolves to this value
        # AT THE INPUT LEVEL (visible in the GH UI, not buried in an
        # expression). A `push` trigger has no `inputs` block at all, so
        # resolve-runner's `|| 'camelot-builder-pleme-eks'` below still
        # carries the same literal for that path -- GHA expression strings
        # are opaque to YAML anchors/aliases (confirmed: an alias can't be
        # spliced into the middle of a `${{ }}` string), so a second
        # occurrence for the push-trigger case is the actual floor here,
        # not a missed DRY-up.
        default: camelot-builder-pleme-eks

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  # The single source of truth for "which runner" and "does it get rio's
  # LAN-local cache" -- computed once via pure GHA expressions (no shell),
  # consumed via `needs.resolve-runner.outputs.*` by every job below. A
  # `with:` block for a reusable-workflow call can read `needs` and
  # `inputs` directly (confirmed via actionlint's context-availability
  # error) but NOT a top-level `env:` -- this job exists because that path
  # doesn't exist in GHA, not out of unnecessary indirection.
  resolve-runner:
    name: resolve build runner
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ inputs.runner || 'camelot-builder-pleme-eks' }}
      # rio's Attic cache is reachable ONLY from rio's own LAN, so it is
      # only ever wired up when the target is EXPLICITLY rio-build-01 (a
      # manual override) -- the default (camelot-builder-pleme-eks) and any
      # other override (e.g. ubuntu-latest) both skip it.
      use-rio-cache: ${{ inputs.runner == 'rio-build-01' }}
    steps:
      - run: echo "runner=${{ inputs.runner || 'camelot-builder-pleme-eks' }}"

  # The image ships on every merge — the auto-release path. Two flat,
  # static variants (never both); `resolve-runner`'s single boolean output
  # picks which one runs, and neither variant's `with:` block contains a
  # conditional field. `image-rio` is now the NON-DEFAULT variant — it only
  # runs on an explicit `workflow_dispatch` override back to `rio-build-01`
  # (see the top-of-file comment); every push-triggered merge takes
  # `image-fallback` onto `camelot-builder-pleme-eks`.
  #
  # rio-build-01 is a single homelab node (~13Gi free). The embedded build
  # compiles native ruby gems (nio4r, puma, …) + Rust crates from source (no
  # binary cache serves the pleme gem builds without the Attic substituter
  # below). At maxJobs:2 nix ran several native compiles CONCURRENTLY and
  # the aggregate peak RAM OOM-killed the build (signal 9) — twice, on r38.
  # SERIALIZE the build: maxJobs:1 means one derivation at a time, so peak
  # RAM is the single largest compile, well under node memory. cores:1 (was
  # 2): even at maxJobs:1 the SINGLE rust_pangea-operator crate compile
  # (codegen-units=1 + LTO + the embedded-ruby/magma binary) is one
  # memory-heavy rustc that OOM-killed (signal 9) on r40 under load; cores:1
  # makes that rustc single-threaded → lowest peak RAM regardless of node.
  # Both settings are kept on the fallback variant too -- camelot-builder-
  # pleme-eks's runner pod caps at 6Gi (akeyless-k8s clusters/camelot-eks/
  # infrastructure/ci/runner-scale-set-pleme.yaml
  # template.spec.containers[0].resources.limits.memory), TIGHTER than
  # rio's ~13Gi, so the same OOM risk applies there and cores:1/maxJobs:1
  # is the load-bearing mitigation, not a rio-specific tune. Unverified
  # empirically on camelot-builder-pleme-eks as of this retarget — watch
  # the first few real runs on this pool for signal-9 exits; if it OOMs
  # even at cores:1, the fix is a runner-pod memory bump in that same
  # runner-scale-set-pleme.yaml, not a further squeeze here.
  image-rio:
    name: container image → ghcr.io (rio, manual override only)
    needs: resolve-runner
    if: needs.resolve-runner.outputs.use-rio-cache == 'true'
    uses: pleme-io/substrate/.github/workflows/image-push.yml@main
    with:
      imageAttr: dockerImage-operator-embedded-amd64
      imageName: pleme-io/pangea-operator
      # `r<run_number>` makes the tag sortable by recency for Flux ImagePolicy
      # (a git sha alone isn't orderable); the sha keeps it traceable.
      tag: embedded-amd64-r${{ github.run_number }}-${{ github.sha }}
      additionalTags: latest-embedded-amd64
      runner: rio-build-01
      buildCores: "1"
      maxJobs: "1"
      # Attic binary cache on rio's OWN LAN -- resolvable only from rio's own
      # network, so this variant ONLY ever runs when the target IS rio (the
      # `if:` above). tend prebuilds fleet closures into the `nexus` cache;
      # pulling from it lets the heavy deps (ruby, native gems, magma,
      # common crates) SUBSTITUTE instead of compiling cold. Read-only
      # token, mounted as a netrc on the runner (SOPS secret arc-attic-netrc).
      extraSubstituters: "http://rio:8080/nexus"
      extraTrustedPublicKeys: "nexus:aZ0dDIXpfD1fIzN4z9waAWim7R8paT1qZhxQydlUZ90="
      netrcFile: "/etc/attic/netrc"
    secrets:
      # BOT_PAT carries write:packages for ghcr.io/pleme-io/* — the proven
      # ghcr-push token (matches caixa-/helm-auto-release.yml). `secrets: inherit`
      # passes it only as secrets.BOT_PAT, but image-push expects GHCR_TOKEN, so it
      # fell back to GITHUB_TOKEN — which lacks package-write on this org package
      # (push failed: permission_denied: write_package). Map it explicitly.
      GHCR_TOKEN: ${{ secrets.BOT_PAT }}

  # The DEFAULT variant for every push-triggered merge: no rio-local cache
  # (unreachable off rio's LAN), runner is `camelot-builder-pleme-eks`
  # unless overridden. Warm build -- camelot-eks's own sui cache substituter
  # is reachable from this pool (see extraSubstituters below), unlike
  # Mode-1's now-retired pool.
  image-fallback:
    name: container image → ghcr.io (camelot-builder-pleme-eks / override)
    needs: resolve-runner
    if: needs.resolve-runner.outputs.use-rio-cache != 'true'
    uses: pleme-io/substrate/.github/workflows/image-push.yml@main
    with:
      imageAttr: dockerImage-operator-embedded-amd64
      imageName: pleme-io/pangea-operator
      tag: embedded-amd64-r${{ github.run_number }}-${{ github.sha }}
      additionalTags: latest-embedded-amd64
      runner: ${{ needs.resolve-runner.outputs.runner }}
      buildCores: "1"
      maxJobs: "1"
      # Camelot's in-cluster sui binary-cache (theory/ATATAME.md's "sui cache
      # serve" L1 origin, deployed camelot-eks/infrastructure/sui) -- the same
      # two-field wiring breathe/image.yml already ships. Only reachable from
      # an ARC pod genuinely inside camelot-eks's own network (its NetworkPolicy
      # gates ingress on pleme.io/estrato=build); a GitHub-hosted runner or a
      # Mode-1 pod can't resolve this Kubernetes-internal hostname, so on
      # those targets it's a harmless no-op (nix substituters fail open).
      # ACTIVATED 2026-07-19: the default runner above is now
      # camelot-builder-pleme-eks (Mode-1's pool retired), so this is no
      # longer a parity-only no-op -- builds on the default path now get
      # real substitute-cache benefit from sui. pending-camelot-cache: task
      # #20 tracked the runner-label half of this; that half is done, the
      # rest of #20 (broader fleet-wide cache coverage) remains open.
      extraSubstituters: ${{ vars.CAMELOT_SUI_SUBSTITUTER }}
      requireSigs: ${{ vars.CAMELOT_SUI_REQUIRE_SIGS }}
    secrets:
      GHCR_TOKEN: ${{ secrets.BOT_PAT }}

  # Zero-tolerance CVE gate on the JUST-published embedded image -- found
  # live 2026-07-14: this pipeline had never once scanned its own
  # published artifact. Direct image-scan call (not compliance-attest.yml)
  # since that reusable's scan job is hard-chained behind sbom→sign→slsa
  # for a binary artifact-path this container image doesn't have; adding
  # that chain here is a separate, bigger change than this fix needs.
  #
  # REAL GATE as of 2026-07-17 (was advisory/continue-on-error since
  # 2026-07-14 pending this promotion). A finding here now fails the
  # workflow run for real -- it cannot un-publish the image that was just
  # pushed by image-rio/image-fallback (this fleet's shared image-push.yml
  # reusable builds+pushes as one step; a genuine pre-publish gate would
  # need image-scan's own `local-archive:` input wired ahead of the push,
  # which is a change to the SHARED substrate reusable, out of scope for
  # this repo-level fix), but it now turns CI red and blocks the false
  # "green" a continue-on-error gate silently produced. Tier-honest: this
  # is a real, blocking, POST-publish gate -- promoting it to pre-publish
  # is a named follow-up against pleme-io/substrate's image-push.yml.
  #
  # `image-rio`/`image-fallback` are mutually exclusive (exactly one runs,
  # the other reports `skipped`) -- this is a genuine join condition (GHA
  # has no "depend on whichever of these ran" primitive), not a config-value
  # ternary; it decides CONTROL FLOW once, not a field's content repeatedly.
  cve-scan:
    name: zero-tolerance CVE scan (blocking)
    needs: [image-rio, image-fallback]
    if: always() && (needs.image-rio.result == 'success' || needs.image-fallback.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: pleme-io/actions/image-scan@main
        with:
          image-ref: ghcr.io/pleme-io/pangea-operator:embedded-amd64-r${{ github.run_number }}-${{ github.sha }}
          fail-on-severity: UNKNOWN

  # Binaries + chart publish on a version tag (or manual dispatch) — not on
  # every merge.
  binaries:
    name: cross-arch binaries → GH Release
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    uses: pleme-io/substrate/.github/workflows/rust-binary-release.yml@main
    with:
      binary-name: pangea-operator
    secrets: inherit

  chart:
    name: Helm chart → ArtifactHub OCI
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    uses: pleme-io/substrate/.github/workflows/helm-chart-release.yml@main
    with:
      chart-path: ./pangea-operator/charts/pangea-operator
      oci-registry: oci://ghcr.io/pleme-io/pangea-operator/charts
    secrets: inherit
