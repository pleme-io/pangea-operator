name: ci

on: [push, pull_request]

jobs:
  flake-check:
    # Routed off the metered default -- this PRIVATE repo's GitHub-hosted
    # runs currently fail outright under an account billing/spending-limit
    # gate ("recent account payments have failed"), independent of any
    # job's own content. Matches release.yml's resolve-runner fix and the
    # camelot skill's documented fleet pattern for private pleme-io repos.
    runs-on: ${{ github.event.repository.private && 'camelot-builder-pleme-eks' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      # magic-nix-cache-action is EOL'd upstream (repo-scoped, can't carry a
      # fleet closure -- purify skill's own standing guidance) and outright
      # broken on this runner (`xz: not found` unpacking its own cache
      # blob), failing this job's first step on every push. Dropped rather
      # than patched.
      #
      # ADDED 2026-07-25 (closes task #20's opening symptom for this job):
      # this step previously carried ZERO substituter config, so every
      # `flake-check` run -- including a bare `.trivyignore`-only change --
      # paid a full cold rebuild of the native amd64 embedded operator
      # image. camelot-builder-pleme-eks pods sit inside camelot-eks's own
      # network where sui's in-cluster super-cache (theory/ATATAME.md's L1
      # origin) is reachable, the same wiring release.yml's image-fallback
      # job already proved live (vars.CAMELOT_SUI_SUBSTITUTER, set
      # 2026-07-19). `determinate: false` matches image-push.yml's own
      # documented reason: Determinate Nix ignores `extra-conf` and manages
      # its own daemon config, so extra-substituters would silently no-op
      # under it -- install upstream Nix instead, where extra-conf is
      # honored by the trusted daemon regardless of trusted-user status.
      # ADDED 2026-07-25 (real, load-bearing fix, task #80): the cache
      # wiring above surfaced this job's ACTUAL standing failure -- every
      # run for days (confirmed via `gh run list`, predates this commit)
      # dies with `unable to download
      # '.../repos/pleme-io/tsunagu/tarball/...': HTTP error 404`. tsunagu
      # is a private flake input; an anonymous api.github.com tarball fetch
      # 404s a private repo the same way it would a nonexistent one (GitHub
      # never distinguishes the two for an unauthenticated caller). This
      # job carried zero git credentials at the Nix level. Same fix,
      # same line, as image-push.yml's own `access-tokens` addition
      # (2026-07-23) for the identical class of gap.
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: false
          extra-conf: |
            sandbox = relaxed
            access-tokens = github.com=${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}
            extra-substituters = ${{ vars.CAMELOT_SUI_SUBSTITUTER }}
            require-sigs = ${{ vars.CAMELOT_SUI_REQUIRE_SIGS }}
      # `nix flake check` builds EVERY packages.x86_64-linux.* + apps.x86_64-linux.*
      # output for the current system — including dockerImage-operator-embedded-arm64
      # / push-image-operator-embedded-arm64, which mkEmbeddedOperatorImage builds
      # for aarch64-linux (a genuine CROSS target). This bare ubuntu-latest runner
      # has no remote/emulated aarch64-linux builder registered, so that build has
      # failed every run since ~2026-07-12 ("Cannot build ...: platform mismatch,
      # Required system aarch64-linux, Current system x86_64-linux") — CI has been
      # red on every push to main. Real fix belongs in flake.nix (stop registering
      # the arm64 image under every host system); until that lands, verify the
      # actual NATIVE, SHIPPABLE artifact instead of the broken blanket check —
      # this is the exact target release.yml's `image` job builds and ships, on the
      # same x86_64-linux architecture as this runner, so it's a real build, not
      # just an eval.
      - name: nix build — native amd64 embedded operator image (the real shipped artifact)
        id: build
        run: |
          OUT=$(nix build .#dockerImage-operator-embedded-amd64 --no-link --print-build-logs --print-out-paths)
          echo "out-path=${OUT}" >> "$GITHUB_OUTPUT"
      # Write half of the substituter config above -- without this, the
      # store path this job just built (or substituted) is never pushed
      # back, so sui only ever helps a run that happens to follow one that
      # ALSO paid to build the same derivation from source. Same action,
      # same shape as nix-image-auto-release.yml's own "Push built image to
      # super-cache" step. Best-effort by construction (super-cache-save
      # never fails its caller on a push error) -- never gates this job.
      - name: Push built image to super-cache (sui)
        uses: pleme-io/actions/super-cache-save@main
        with:
          endpoint: ${{ vars.CAMELOT_SUI_SUBSTITUTER }}
          outputs: ${{ steps.build.outputs.out-path }}
          key: dockerImage-operator-embedded-amd64

  cargo-test:
    # Runs inside `.#ruby-eval` via the shared substrate reusable workflow
    # (pleme-io/substrate/.github/workflows/nix-devshell-cargo-test.yml)
    # instead of a bare dtolnay/rust-toolchain job. Previously this passed
    # only because ubuntu-latest's ambient system Ruby happened to satisfy
    # magnus/rb-sys's link requirement — real, but accidental, with no pin
    # and no local darwin-workstation equivalent. Now it's the same pinned
    # nix devShell every local dev + CRD-regen invocation already uses
    # (pangea-operator/CLAUDE.md §Generating CRDs), so CI and local dev
    # agree on the exact Ruby/libclang environment, not by luck.
    # runner override (2026-07-25): the reusable's own `runner` input
    # defaults to the metered `ubuntu-24.04` -- this job never overrode it,
    # so every run has been dying before it even starts ("recent account
    # payments have failed or your spending limit needs to be increased"),
    # the exact billing gate every OTHER job in this file already routes
    # around. Confirmed via the check-run's own annotation (the run log
    # itself is unfetchable for a called-reusable-workflow job -- GitHub
    # excludes it from both the per-job log API and the run-level log
    # archive; the annotations API is the only surface that surfaced this).
    uses: pleme-io/substrate/.github/workflows/nix-devshell-cargo-test.yml@main
    with:
      runner: camelot-builder-pleme-eks
      devshell: ruby-eval
      test-args: "--workspace --no-fail-fast"
    secrets: inherit

  cargo-test-no-default-features:
    # `cargo-test` above always compiles with executor_magma + embedded_ruby
    # ON (default features, via the `.#ruby-eval` devshell) — so
    # `magma_executor_for`'s `#[cfg(not(feature = "executor_magma"))]`
    # fallback arm, and everything downstream of it (incl. the
    # `resolve_and_check` effective-backend degrade it feeds), has never
    # actually been *compiled* by CI, only reasoned about. This leg builds
    # + runs the lib tests with default features off so that arm is real
    # code under test, not just an unreached branch.
    #
    # Scoped to `-p pangea-operator` (not `--workspace`): `pangea-ruby-eval`
    # is a workspace member that needs libruby to build unconditionally,
    # independent of pangea-operator's own feature flags, so a bare
    # `--workspace --no-default-features` would still pull it in. Same
    # cheap ubuntu-latest / no-libruby shape as crd-drift.yml's
    # `--no-default-features -- --generate-crds` step.
    # Routed off the metered default -- this PRIVATE repo's GitHub-hosted
    # runs currently fail outright under an account billing/spending-limit
    # gate ("recent account payments have failed"), independent of any
    # job's own content. Matches release.yml's resolve-runner fix and the
    # camelot skill's documented fleet pattern for private pleme-io repos.
    runs-on: ${{ github.event.repository.private && 'camelot-builder-pleme-eks' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # ── C linker (2026-07-25) ────────────────────────────────────────────
      # This bare dtolnay/rust-toolchain job has no C compiler on PATH --
      # the camelot-builder-pleme-eks runner image carries none -- so every
      # run has been dying at the FIRST crate compiled (even pure-Rust
      # proc-macro2/quote/serde, since rustc still shells out to a system
      # linker for the final link step): "error: linker `cc` not found".
      # Nix already installs cleanly on this same runner (flake-check's own
      # `nix build` above proves it); rather than assume an ambient package
      # manager (apt/dnf — this image's actual base isn't guaranteed), pull
      # JUST a C toolchain via Nix and put it on PATH for the rest of this
      # job. Deliberately NOT routed through the `.#ruby-eval` devShell like
      # cargo-test's sibling job — this leg's whole point (per the comment
      # above) is a cheap, no-libruby-anywhere build; a minimal `gcc` shell
      # keeps that intent intact instead of pulling in ruby/libclang unused.
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ secrets.BOT_PAT }}
      - name: Put a Nix-provided C toolchain on PATH
        run: echo "$(nix build --no-link --print-out-paths 'nixpkgs#gcc')/bin" >> "$GITHUB_PATH"
      # ── Private git-dependency credential (2026-07-25) ──────────────────
      # A bare dtolnay/rust-toolchain + `cargo test` job has zero git-
      # credential wiring for Cargo.toml's private git dep on tsunagu, so
      # every run has been dying with "failed to authenticate when
      # downloading repository ... tsunagu" — same failure class already
      # fixed in release.yml's binaries job (32b16bd) and in the shared
      # nix-devshell-cargo-test.yml reusable, never applied here. Unset
      # actions/checkout's THIS-repo-scoped extraheader first (it silently
      # wins over url.insteadOf by prefix match if left in place).
      - name: Configure git credentials for private git dependencies (cargo)
        env:
          GIT_AUTH_TOKEN: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GIT_AUTH_TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --unset-all http.https://github.com/.extraheader || true
      - name: cargo test -p pangea-operator --no-default-features (no libruby, no magma)
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: cargo test -p pangea-operator --no-default-features --lib --no-fail-fast

  coverage:
    needs: cargo-test
    # Routed off the metered default -- this PRIVATE repo's GitHub-hosted
    # runs currently fail outright under an account billing/spending-limit
    # gate ("recent account payments have failed"), independent of any
    # job's own content. Matches release.yml's resolve-runner fix and the
    # camelot skill's documented fleet pattern for private pleme-io repos.
    runs-on: ${{ github.event.repository.private && 'camelot-builder-pleme-eks' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Coverage baseline (theory/PANGEA-OPERATOR.md §XVII row 6): informational
      # only — this is the reference floor for future work, not a merge gate.
      # `continue-on-error` because coverage-upload's own run.tlisp exits 1 on
      # a tarpaulin/upload failure; that must never fail this job. Kept on a
      # plain ubuntu-latest + dtolnay/rust-toolchain env (cargo-tarpaulin
      # itself doesn't need the devShell's Ruby pin for instrumentation) —
      # the pin matters for the actual test correctness, not the coverage
      # scrape. cargo-tarpaulin runs `--workspace`, giving one aggregate
      # cobertura.xml; Codecov's own file browser then breaks coverage down
      # per-crate path (pangea-types/pangea-operator/pangea-cli/
      # pangea-ruby-eval/pangea-operator-mcp) — the action has no separate
      # per-crate input.
      - name: coverage baseline (informational only)
        continue-on-error: true
        uses: pleme-io/actions/coverage-upload@main
