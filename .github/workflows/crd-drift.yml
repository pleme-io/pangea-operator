name: crd-drift

# Forcing-function: the helmworks chart's pangea-operator CRDs MUST equal what
# this operator's Rust structs generate via `--generate-crds`. A struct field
# added without regenerating the chart CRD (the class that caused the
# 2026-06-16 ~2-day outage + the dashboard-as-code activation cascade) fails
# here, at the PR, instead of silently on the cluster.
#
# Runs on cheap GH-hosted runners: `--no-default-features` drops `embedded_ruby`
# (libruby) + `executor_magma`, and `generate_crds()` is pure kube/schemars —
# so no self-hosted ARC runner is needed.

on: [push, pull_request]

jobs:
  crd-drift:
    # Routed off the metered default -- see release.yml's resolve-runner
    # fix: this PRIVATE repo's GitHub-hosted runs fail outright under an
    # account billing gate, independent of this job's own content.
    runs-on: camelot-builder-pleme-eks
    steps:
      - name: Checkout operator
        uses: actions/checkout@v4

      # ── Private git-dependency credential (same fix as release.yml's
      # 32b16bd / image-push.yml's ccfd349) ── this job's Cargo.toml pulls
      # several private pleme-io git deps (tsunagu, magma, shigoto, shikumi,
      # gen) directly via `cargo run`, with zero git-credential wiring --
      # "failed to get `tsunagu` as a dependency". actions/checkout@v4 also
      # leaves its own ephemeral, THIS-repo-scoped GITHUB_TOKEN in local git
      # config (http.https://github.com/.extraheader), matched by URL PREFIX
      # against ANY git operation from this checkout -- unset it before
      # configuring BOT_PAT or it silently wins instead.
      - name: Configure git credentials for private git dependencies (cargo)
        env:
          GIT_AUTH_TOKEN: ${{ secrets.BOT_PAT }}
        run: |
          git config --global url."https://x-access-token:${GIT_AUTH_TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --unset-all http.https://github.com/.extraheader || true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # ── C linker (2026-07-26) ────────────────────────────────────────────
      # Same gap as ci.yml's cargo-test-no-default-features job: the
      # camelot-builder-pleme-eks runner image carries no C compiler, so a
      # bare dtolnay/rust-toolchain job dies at the first crate compiled
      # ("error: linker `cc` not found") — this job has been red on every
      # single run since moving onto this runner, silently defeating the
      # forcing-function the header comment above describes. Nix already
      # installs cleanly on this runner (proved by ci.yml's flake-check);
      # pull just a C toolchain via Nix rather than assume an ambient
      # package manager.
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ secrets.BOT_PAT }}
      - name: Put a Nix-provided C toolchain on PATH
        run: echo "$(nix build --no-link --print-out-paths 'nixpkgs#gcc')/bin" >> "$GITHUB_PATH"

      - name: Regenerate CRDs from the Rust structs (no libruby)
        env:
          # Forces cargo to shell out to the real git binary (which honors
          # the url.insteadOf rewrite above) instead of its bundled libgit2
          # backend (which does not).
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          cargo run -p pangea-operator --bin pangea-operator \
            --no-default-features -- --generate-crds > /tmp/all-crds.yaml
          echo "generated $(grep -c '^kind: CustomResourceDefinition' /tmp/all-crds.yaml) CRDs"

      - name: Checkout helmworks (public — no token)
        uses: actions/checkout@v4
        with:
          repository: pleme-io/helmworks
          path: _helmworks

      # Nix-provided python, for the SAME reason the C toolchain above is
      # Nix-provided: this job runs on `camelot-builder-pleme-eks`, an ARC
      # container image, and it has no ambient package manager. The previous
      # `python3 -m pip install pyyaml` died on
      # `/usr/bin/python3: No module named pip` — a self-hosted-runner
      # assumption that only ever held on a GitHub-hosted image.
      - name: Put a Nix-provided python3 (with PyYAML) on PATH
        # NOTE the shape: capture, VERIFY, then publish. The obvious
        # one-liner `echo "$(nix build ...)/bin" >> "$GITHUB_PATH"` is a
        # silent failure -- if the build fails, the substitution is empty,
        # the step echoes a bare "/bin", and it EXITS 0. That is exactly what
        # happened on run 30692421818: this step reported success and the
        # drift gate then died on "FATAL: PyYAML required", two steps apart
        # with nothing red in between.
        run: |
          set -euo pipefail
          out=$(nix build --no-link --print-out-paths --impure --expr \
            'with (builtins.getFlake "nixpkgs").legacyPackages.${builtins.currentSystem};
             python3.withPackages (ps: [ ps.pyyaml ])')
          test -n "$out" && test -x "$out/bin/python3"
          # Prove the thing we actually need, here, where the failure is
          # attributable -- not two steps later inside someone else's script.
          "$out/bin/python3" -c 'import yaml; print("pyyaml", yaml.__version__)'
          echo "$out/bin" >> "$GITHUB_PATH"

      - name: CRD drift gate
        run: |
          python3 scripts/check-crd-drift.py \
            /tmp/all-crds.yaml \
            _helmworks/charts/pangea-operator/crds \
            scripts/crd-drift-baseline.txt
