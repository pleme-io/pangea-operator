---
# ExternalSecret for PostgreSQL credentials (for CNPG bootstrap)
# Pulls credentials from OpenBao and creates K8s Secret
# CloudNativePG expects: username, password in basic-auth format
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pangea-postgres-credentials
  namespace: pangea-system
  labels:
    app.kubernetes.io/name: pangea
    app.kubernetes.io/component: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: pangea-postgres-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: secret/data/pangea/postgres
        property: username
    - secretKey: password
      remoteRef:
        key: secret/data/pangea/postgres
        property: password
---
# ExternalSecret for PostgreSQL connection (for operator usage)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pangea-postgres-connection
  namespace: pangea-system
  labels:
    app.kubernetes.io/name: pangea
    app.kubernetes.io/component: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: pangea-postgres-connection
    creationPolicy: Owner
    template:
      data:
        # Standard connection string for Rust sqlx
        DATABASE_URL: "postgres://{{ .username }}:{{ .password }}@pangea-postgres-rw.pangea-system.svc:5432/pangea_state"
        # Individual components for PangeaNamespace secretRef
        username: "{{ .username }}"
        password: "{{ .password }}"
        host: "pangea-postgres-rw.pangea-system.svc"
        port: "5432"
        database: "pangea_state"
  data:
    - secretKey: username
      remoteRef:
        key: secret/data/pangea/postgres
        property: username
    - secretKey: password
      remoteRef:
        key: secret/data/pangea/postgres
        property: password
