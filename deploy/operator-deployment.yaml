---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pangea-operator
  labels:
    app.kubernetes.io/name: pangea
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: pangea
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pangea
      app.kubernetes.io/component: operator
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pangea
        app.kubernetes.io/component: operator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: pangea-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        # Main operator container
        - name: operator
          image: ghcr.io/pleme-io/nexus/pangea-operator:latest
          imagePullPolicy: Always
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
            - name: graphql
              containerPort: 8081
              protocol: TCP
          env:
            - name: RUST_LOG
              value: "info,pangea_operator=debug"
            - name: LOG_FORMAT
              value: "json"
            - name: HEALTH_ADDR
              value: "0.0.0.0:8080"
            - name: GRAPHQL_ADDR
              value: "0.0.0.0:8081"
            - name: PANGEA_CONFIG
              value: "/etc/pangea/config.yaml"
            - name: COMPILER_ENDPOINT
              value: "http://localhost:8082"
            # OpenTelemetry Configuration
            - name: OTEL_SERVICE_NAME
              value: "pangea-operator"
            - name: OTEL_SERVICE_VERSION
              value: "0.1.0"
            - name: OTEL_SERVICE_NAMESPACE
              value: "pangea-system"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "prometheus"
            - name: OTEL_LOGS_EXPORTER
              value: "otlp"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.name=pangea-operator,service.namespace=pangea-system,environment=staging,product=pangea"
            - name: OTEL_PROPAGATORS
              value: "tracecontext,baggage"
            - name: OTEL_TRACES_SAMPLER
              value: "parentbased_traceidratio"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "1.0"
            - name: PROMETHEUS_METRICS_ENABLED
              value: "true"
            - name: PROMETHEUS_METRICS_PORT
              value: "8080"
          volumeMounts:
            - name: config
              mountPath: /etc/pangea
              readOnly: true
            - name: workdir
              mountPath: /tmp/pangea
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2

        # Compiler sidecar (Ruby Pangea gem)
        - name: compiler
          image: ghcr.io/pleme-io/nexus/pangea-compiler:latest
          imagePullPolicy: Always
          ports:
            - name: compile
              containerPort: 8082
              protocol: TCP
          env:
            - name: COMPILE_ADDR
              value: "0.0.0.0:8082"
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: compile
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: compile
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2

      volumes:
        - name: config
          configMap:
            name: pangea-config
            optional: true
        - name: workdir
          emptyDir: {}
      terminationGracePeriodSeconds: 30
