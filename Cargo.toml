[workspace]
resolver = "2"
# pangea-web is excluded - built separately with WASM toolchain
members = [
    "pangea-types",
    "pangea-operator",
    "pangea-cli",
    "pangea-ruby-eval",
    "pangea-operator-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Pleme <engineering@pleme.io>"]
license = "Apache-2.0"
repository = "https://github.com/pleme-io/nexus"

[workspace.dependencies]
# Shared types
pangea-types = { path = "pangea-types" }

# Typed-dispatcher catalog integration
# (theory/UNIFIED-COMPUTING-MODEL.md §VI).
gen-platform = { git = "https://github.com/pleme-io/gen" }
gen-types = { git = "https://github.com/pleme-io/gen" }

# Convergence primitives — the reactive-policy cascade consumes the
# canonical innermost-wins-per-field merge (theory/CONVERGENCE-ADOPTION.md
# §II.2). Git, not crates.io: the operator is a binary (not a published
# library) and the re-homed `policy::CascadePolicy` is not on crates.io
# 0.1.0 yet. Rev-pinned for determinism (matches how tend pins
# shigoto-emit) — bump deliberately on a shigoto upgrade.
#
# Bumped 2026-07-18 (417bf9d -> e4e4c92, origin/main HEAD at bump time) to
# pick up `shigoto-rank` (added at 8a35410, after the prior pin) — the
# generic priority × urgency × fairness-deficit ranking primitive the
# controller's scheduling module now delegates to. Purely additive between
# the two revs for every symbol pangea-operator already consumed (verified
# via `git diff` on shigoto-types — new `converge` module + rustfmt-only
# churn, no changed signatures).
shigoto-types = { git = "https://github.com/pleme-io/shigoto", rev = "e4e4c92b7327de197e492fe8cb7589f4d04c9309" }
shigoto-dag = { git = "https://github.com/pleme-io/shigoto", rev = "e4e4c92b7327de197e492fe8cb7589f4d04c9309" }
shigoto-budget = { git = "https://github.com/pleme-io/shigoto", rev = "e4e4c92b7327de197e492fe8cb7589f4d04c9309" }
shigoto-rank = { git = "https://github.com/pleme-io/shigoto", rev = "e4e4c92b7327de197e492fe8cb7589f4d04c9309" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Logging/tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
log = "0.4"

# Time
chrono = { version = "0.4", features = ["serde"], default-features = false }
# Cron expression parsing + next-fire-time computation
# (ComplianceScheduleController::handle_scheduled — spec.schedule).
cron = "0.15"

# Error handling
anyhow = "1"
thiserror = "2"

# GraphQL server
async-graphql = { version = "7", features = ["dataloader"] }
async-graphql-axum = "7"

# GraphQL client
cynic = { version = "3", features = ["http-reqwest"] }
cynic-codegen = "3"

# HTTP server
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
hyper = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Kubernetes
# `unstable-runtime` (= unstable-runtime-stream-control + reconcile-on +
# subscribe) enables `Controller::for_stream` + `predicate_filter`,
# which is the canonical way to drop status-only watch events at the
# stream layer (defense-in-depth on top of every controller's status-
# write diff-gate). See controller::generation_filter.
kube = { version = "0.98", features = ["runtime", "derive", "unstable-runtime"] }
k8s-openapi = { version = "0.24", features = ["v1_31"] }
schemars = { version = "0.8", features = ["chrono"] }

# Database
# default-features = false drops sqlx's `any` driver (the AnyDriver pulls every
# backend — sqlx-mysql + sqlx-sqlite + libsqlite3-sys). The operator only uses
# Postgres (no sqlx::Any / Sqlite anywhere), and sqlx-sqlite 0.8.6 fails to
# compile against libsqlite3-sys's pkg-config bindings (missing sqlite3_serialize
# / prepare_v3). Re-add the non-`any` defaults the operator relies on.
sqlx = { version = "0.8", default-features = false, features = ["macros", "migrate", "json", "postgres", "runtime-tokio"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }
colored = "2"

# WASM (for pangea-web)
yew = { version = "0.21", features = ["csr"] }
yew-router = "0.18"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
gloo-net = "0.5"
gloo-storage = "0.3"
gloo-timers = "0.3"
web-sys = "0.3"
js-sys = "0.3"

[profile.release]
# NOTE: the OOM cure (lto off) is applied to the OPERATOR CRATE ONLY, in
# flake.nix via `-Clto=off` on the `pangea-operator` derivation — NOT here.
# Turning lto off in this WORKSPACE profile changes every dependency's drv
# hash, forcing a full cold rebuild of the entire tree; on rio's single small
# builder (which also runs the k3s cluster) that rebuild exhausts RAM and the
# kernel OOM-killer fells random innocent crates (clang-sys, kube-client, …).
# Keeping these values matches the cached dep closure so deps SUBSTITUTE and
# only the operator crate compiles (lto-off, low memory). See flake.nix.
lto = true
codegen-units = 1
opt-level = "z"
strip = true
