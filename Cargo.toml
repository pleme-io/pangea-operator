[workspace]
resolver = "2"
# pangea-web is excluded - built separately with WASM toolchain
members = [
    "pangea-types",
    "pangea-operator",
    "pangea-cli",
    "pangea-ruby-eval",
    "pangea-operator-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Pleme <engineering@pleme.io>"]
license = "Apache-2.0"
# Was `pleme-io/nexus` — wrong repo, and a PRIVATE one. Harmless while this
# repo was closed and unpublished; not harmless now that it is declared
# public with `exposure: oss`, because `repository` is what crates.io and
# docs.rs link from every published crate. A public crate pointing at a
# private, unrelated repository yields a 404 for every reader.
repository = "https://github.com/pleme-io/pangea-operator"

[workspace.dependencies]
# Shared types
pangea-types = { path = "pangea-types" }

# Typed-dispatcher catalog integration
# (theory/UNIFIED-COMPUTING-MODEL.md §VI).
gen-platform = "0.1.34"
gen-types = "0.1.34"

# Convergence primitives — the reactive-policy cascade consumes the
# canonical innermost-wins-per-field merge (theory/CONVERGENCE-ADOPTION.md
# §II.2). Git, not crates.io: the operator is a binary (not a published
# library) and the re-homed `policy::CascadePolicy` is not on crates.io
# 0.1.0 yet. Rev-pinned for determinism (matches how tend pins
# shigoto-emit) — bump deliberately on a shigoto upgrade.
#
# Bumped 2026-07-18 (417bf9d -> e4e4c92, origin/main HEAD at bump time) to
# pick up `shigoto-rank` (added at 8a35410, after the prior pin) — the
# generic priority × urgency × fairness-deficit ranking primitive the
# controller's scheduling module now delegates to. Purely additive between
# the two revs for every symbol pangea-operator already consumed (verified
# via `git diff` on shigoto-types — new `converge` module + rustfmt-only
# churn, no changed signatures).
shigoto-types = "0.1.15"
shigoto-dag = "0.1.15"
shigoto-budget = "0.1.15"
shigoto-rank = "0.1.15"

# Credential handling.
#
# cofre-fs: a secret file gets its mode from open(2) rather than a chmod
# afterwards, so there is no interval in which it is world-readable.
# cofre-secret: a credential type that does not implement AsRef<OsStr>, so
# `Command::arg(secret)` is a compile error rather than a review comment.
#
# Both are dependency-free. Rev-pinned for the same reason as shigoto and
# magma above: an unpinned `git =` lets a routine `cargo update` move the
# live operator's credential handling with nothing asking for it.
cofre-fs = "0.1.4"
cofre-secret = "0.1.4"

# Base64 — encodes the `Authorization: basic` value of the git credential
# header that carries the gem-cache PAT through the environment. Already in
# the tree transitively; declared here because it is now used directly.
base64 = "0.22"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Logging/tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
log = "0.4"

# Time
chrono = { version = "0.4", features = ["serde"], default-features = false }
# Cron expression parsing + next-fire-time computation
# (ComplianceScheduleController::handle_scheduled — spec.schedule).
cron = "0.15"

# Error handling
anyhow = "1"
thiserror = "2"

# GraphQL server
async-graphql = { version = "7", features = ["dataloader"] }
async-graphql-axum = "7"

# GraphQL client
cynic = { version = "3", features = ["http-reqwest"] }
cynic-codegen = "3"

# HTTP server
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
hyper = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Kubernetes
# `unstable-runtime` (= unstable-runtime-stream-control + reconcile-on +
# subscribe) enables `Controller::for_stream` + `predicate_filter`,
# which is the canonical way to drop status-only watch events at the
# stream layer (defense-in-depth on top of every controller's status-
# write diff-gate). See controller::generation_filter.
#
# 0.98 -> 0.99 (2026-08-06) is a SECURITY bump, not a routine one. 0.98's
# kube-runtime pulls `backoff` (RUSTSEC-2025-0012, unmaintained), which drags
# `instant` (RUSTSEC-2024-0384, unmaintained), and 0.98's kube-client pulls
# `rustls-pemfile` (RUSTSEC-2025-0134, unmaintained). All three have
# `patched: []` — no bump of the crate itself exists, so the only fix is to
# stop depending on them, and 0.99 is the first release that does.
# Deliberately 0.99 and not 4.x: 0.99 keeps k8s-openapi at 0.24 and keeps the
# `unstable-runtime` feature above, so it is the smallest jump that closes all
# three. Chasing the newest major here would be a rewrite, not a fix.
kube = { version = "4.2", features = ["runtime", "derive", "unstable-runtime"] }
k8s-openapi = { version = "0.24", features = ["v1_31"] }
schemars = { version = "0.8", features = ["chrono"] }

# Database
# default-features = false drops sqlx's `any` driver (the AnyDriver pulls every
# backend — sqlx-mysql + sqlx-sqlite + libsqlite3-sys). The operator only uses
# Postgres (no sqlx::Any / Sqlite anywhere), and sqlx-sqlite 0.8.6 fails to
# compile against libsqlite3-sys's pkg-config bindings (missing sqlite3_serialize
# / prepare_v3). Re-add the non-`any` defaults the operator relies on.
sqlx = { version = "0.8", default-features = false, features = ["macros", "migrate", "json", "postgres", "runtime-tokio"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }
colored = "2"

# WASM (for pangea-web)
yew = { version = "0.21", features = ["csr"] }
yew-router = "0.18"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
gloo-net = "0.5"
gloo-storage = "0.3"
gloo-timers = "0.3"
web-sys = "0.3"
js-sys = "0.3"

[profile.release]
# NOTE: the OOM cure (lto off) is applied to the OPERATOR CRATE ONLY, in
# flake.nix via `-Clto=off` on the `pangea-operator` derivation — NOT here.
# Turning lto off in this WORKSPACE profile changes every dependency's drv
# hash, forcing a full cold rebuild of the entire tree; on rio's single small
# builder (which also runs the k3s cluster) that rebuild exhausts RAM and the
# kernel OOM-killer fells random innocent crates (clang-sys, kube-client, …).
# Keeping these values matches the cached dep closure so deps SUBSTITUTE and
# only the operator crate compiles (lto-off, low memory). See flake.nix.
lto = true
codegen-units = 1
opt-level = "z"
strip = true

# ── ★ THE LAVA CHAIN, PINNED BY GIT REV ──────────────────────────────────
# lava's compile path (record iteration, shape-typed record fields, terraform
# import blocks) is what lets this operator render the estate with no Ruby in
# the process. Those changes are committed and unpublished, and the three
# crates form a chain: lava-eval needs lava-arch needs lava-core.
#
# Patched here rather than waiting on three crates.io releases, for two
# reasons. Publishing is irreversible — a version cannot be withdrawn, only
# yanked — and it would have to happen three times in order before this image
# could build at all. And a `path` patch cannot ship: it resolves only on the
# machine that wrote it. A git rev is reproducible, pinned, and reviewable.
#
# It lives at the WORKSPACE ROOT because that is the only place
# [patch.crates-io] applies. A patch in a member manifest is silently ignored,
# and a member `path` dependency does not reach a TRANSITIVE registry dep —
# which is why lava-eval kept resolving the published lava-arch and failing on
# a missing add_import.
#
# ★ THE REVS HERE MUST MATCH the member manifest's, and both must be at or
# ahead of the commit that introduced the symbol you are calling. They drifted
# once and it cost a release: the patch pinned lava-eval at 34f7c353 while the
# member manifest pinned a394fc4d, so Cargo.lock carried TWO lava-eval entries
# and the build failed E0599 `no method named set_records` — because NEITHER
# rev contained set_records, which landed later on main. A pin is only as good
# as the commit it names; bumping the code without bumping the pin fails in CI
# and nowhere else.
#
# Replace with plain version requirements once the three crates are published.
[patch.crates-io]
lava-core = { git = "https://github.com/pleme-io/lava-core", rev = "f7530d06a52c3356d81415c6611c5ccd2c8cbd06" }
lava-arch = { git = "https://github.com/pleme-io/lava-arch", rev = "035f2f547e299048d96484ef118bada964f96d47" }
lava-eval = { git = "https://github.com/pleme-io/lava-eval", rev = "1b8959e92067e1bbbaa3dfad4b54d4a79098de69" }
