[package]
name = "pangea-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "CLI for Pangea infrastructure management"
license.workspace = true
repository.workspace = true

[[bin]]
name = "pangea"
path = "src/main.rs"

[dependencies]
# Shared types
pangea-types = { workspace = true, features = ["client"] }

# CLI framework
clap = { workspace = true, features = ["wrap_help"] }

# GraphQL client
cynic.workspace = true
reqwest.workspace = true

# Async runtime
tokio.workspace = true
futures = "0.3"

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"

# Output formatting
colored.workspace = true
tabled = "0.17"
indicatif = "0.17"

# Config and paths
directories = "5"
toml = "0.8"

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Utilities
chrono.workspace = true
url = "2"

[build-dependencies]
cynic-codegen.workspace = true

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
