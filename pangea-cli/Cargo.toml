[package]
name = "pangea-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "CLI for Pangea infrastructure management"
license.workspace = true
repository.workspace = true

[[bin]]
name = "pangea"
path = "src/main.rs"

[dependencies]
# Shared types
pangea-types = { workspace = true, features = ["client"] }

# CLI framework
clap = { workspace = true, features = ["wrap_help"] }

# GraphQL client
cynic.workspace = true
# NOT reqwest.workspace (=0.12): cynic 3.13's `http-reqwest` ReqwestExt (the
# source of `.run_graphql()`) is implemented for reqwest 0.13's RequestBuilder.
# Building requests with the workspace's 0.12 RequestBuilder made `run_graphql`
# resolve to nothing (E0599), which broke `cargo test --workspace` (and thus the
# whole repo's test gate). Pin THIS crate to 0.13 to match cynic; the operator
# keeps 0.12 (two reqwest majors already coexist in the lock).
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }

# Async runtime
tokio.workspace = true
futures = "0.3"

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"

# Output formatting
colored.workspace = true
tabled = "0.17"
indicatif = "0.17"

# Config and paths
directories = "5"
toml = "0.8"

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Utilities
chrono.workspace = true
url = "2"

[build-dependencies]
cynic-codegen.workspace = true

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
