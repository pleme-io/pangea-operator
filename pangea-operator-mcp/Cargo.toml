[package]
name = "pangea-operator-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "The MCP surface a model uses to OBSERVE + CONTROL a running pangea-operator — list/get InfrastructureTemplates (status.lastCycle), force reconcile, suspend/resume, read WorkspaceCatalog verify state + ArchitectureGem load phases, restart + status-check the operator Deployment. The CRDs ARE the state (a typed kube facade, not a second store); behind a PangeaStore trait so the tools are mock-tested without a cluster."

[lib]
name = "pangea_operator_mcp"
path = "src/lib.rs"

[[bin]]
name = "pangea-operator-mcp"
path = "src/main.rs"

[dependencies]
# KNOWN, TRACKED EXCEPTION (2026-07-18): rmcp 0.15.0 carries
# GHSA-89vp-x53w-74fx / CVE-2026-42559, a DNS-rebinding flaw in rmcp's
# *Streamable HTTP server transport*. Verified unreachable in this
# binary: the vulnerable surface lives behind the `transport-streamable-
# http-server` feature (which itself requires `server-side-http` +
# `transport-worker`, pulling in axum/tower/sse-stream/http-body). We
# enable only `server` + `transport-io` (stdio transport) — confirmed
# against both the feature graph (`rmcp`'s Cargo.toml) and the resolved
# Cargo.lock dependency list for `rmcp`, which contains none of
# axum/tower/http/http-body/sse-stream/uuid. No HTTP transport code is
# compiled in. Patched version is 1.4.0 — a 0.x→1.x jump outside the
# `"0.15"` manifest range (`cargo update -p rmcp --dry-run` cannot reach
# it without a manifest bump), and a stabilization major release is
# likely to carry real API breakage; not attempted blind given the
# vulnerability is already unreachable here. Revisit on a scoped rmcp 1.x
# migration, not as a security fix.
rmcp = { version = "0.15", features = ["server", "transport-io"] }
# kotae (答え) — the typed answer a machine gives a machine. Every failure
# here was `{"error": <display>}`, so a 404, an RBAC denial and an
# unreachable cluster were one shape with three different remedies.
kotae = "0.1"
kube = { workspace = true }
k8s-openapi = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
async-trait = "0.1"
