[package]
name = "pangea-operator-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "The MCP surface a model uses to OBSERVE + CONTROL a running pangea-operator — list/get InfrastructureTemplates (status.lastCycle), force reconcile, suspend/resume, read WorkspaceCatalog verify state + ArchitectureGem load phases, restart + status-check the operator Deployment. The CRDs ARE the state (a typed kube facade, not a second store); behind a PangeaStore trait so the tools are mock-tested without a cluster."

[lib]
name = "pangea_operator_mcp"
path = "src/lib.rs"

[[bin]]
name = "pangea-operator-mcp"
path = "src/main.rs"

[dependencies]
# CURED 2026-08-13 — CVE-2026-42559 / GHSA-89vp-x53w-74fx (DNS rebinding in
# rmcp's Streamable HTTP server transport) is gone from the lock, not argued
# away. Bumped 0.15 → 3.x, past the 1.4.0 fix.
#
# What was here before was a long, careful, CORRECT argument that the
# vulnerable surface is unreachable in this binary: it lives behind
# `transport-streamable-http-server`, we enable only `server` +
# `transport-io`, and `sse-stream` is absent from the whole closure. All of
# that was true and none of it helped, because a scanner reads the RESOLVED
# VERSION IN THE LOCKFILE and cannot see which features were compiled. The
# argument's own quality was the problem — it was persuasive enough that
# nobody re-opened it for four weeks while it silently blocked every publish.
#
# The deferral rested on one assumption that was never tested: that a
# 0.x → 1.x stabilization release "is likely to carry real API breakage".
# The actual surface is eleven items across 770 lines — the standard
# macro-based server pattern (`#[tool_router]` / `#[tool]` /
# `#[tool_handler]` / `ServerHandler` / `ToolRouter` / `Parameters` /
# `ServerCapabilities` / `ServerInfo` / `schemars` / `stdio` / `ServiceExt`),
# which is precisely the API 1.0 stabilized. Measuring it took a grep.
#
# Reachability analysis belongs in a VEX document with an expiry, if anywhere.
# It does not belong in a manifest comment, because a comment cannot be
# revoked when it stops being true and no gate can read it.
rmcp = { version = "3", features = ["server", "transport-io"] }
# kotae (答え) — the typed answer a machine gives a machine. Every failure
# here was `{"error": <display>}`, so a 404, an RBAC denial and an
# unreachable cluster were one shape with three different remedies.
kotae = "0.1"
kube = { workspace = true }
k8s-openapi = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
async-trait = "0.1"
