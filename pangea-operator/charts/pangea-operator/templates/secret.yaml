{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) .Values.auth.token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pangea-operator.fullname" . }}-auth
  labels:
    {{- include "pangea-operator.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.auth.secretKey }}: {{ .Values.auth.token | b64enc | quote }}
{{- end }}
