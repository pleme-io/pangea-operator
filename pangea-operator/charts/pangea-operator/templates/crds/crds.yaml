---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: infrastructuretemplates.pangea.pleme.io
spec:
  group: pangea.pleme.io
  names:
    categories: []
    kind: InfrastructureTemplate
    plural: infrastructuretemplates
    shortNames:
    - infra
    - it
    singular: infrastructuretemplate
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.pangeaNamespace
      name: Namespace
      type: string
    - jsonPath: .status.resources.total
      name: Resources
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for InfrastructureTemplateSpec via `CustomResource`
        properties:
          spec:
            description: InfrastructureTemplate represents a Pangea infrastructure template to be compiled, planned, and applied by the operator.
            properties:
              autoApprove:
                default: false
                description: Whether to automatically apply changes without manual approval.
                type: boolean
              complianceProfiles:
                description: InSpec compliance profiles to run after apply.
                items:
                  type: string
                type: array
              pangeaNamespace:
                description: Pangea namespace for state isolation. This determines the PostgreSQL schema used for state storage.
                type: string
              providerCredentials:
                description: Provider credentials configuration.
                nullable: true
                properties:
                  aws:
                    description: AWS credentials configuration.
                    nullable: true
                    properties:
                      region:
                        description: Region to use for AWS operations.
                        nullable: true
                        type: string
                      roleArn:
                        description: Optional role ARN to assume.
                        nullable: true
                        type: string
                      secretRef:
                        description: Secret containing AWS credentials.
                        properties:
                          name:
                            description: Name of the Secret.
                            type: string
                          namespace:
                            description: Namespace of the Secret (defaults to same namespace as the resource).
                            nullable: true
                            type: string
                        required:
                        - name
                        type: object
                    required:
                    - secretRef
                    type: object
                  cloudflare:
                    description: Cloudflare credentials configuration.
                    nullable: true
                    properties:
                      secretRef:
                        description: Secret containing Cloudflare API token.
                        properties:
                          name:
                            description: Name of the Secret.
                            type: string
                          namespace:
                            description: Namespace of the Secret (defaults to same namespace as the resource).
                            nullable: true
                            type: string
                        required:
                        - name
                        type: object
                    required:
                    - secretRef
                    type: object
                type: object
              refreshInterval:
                default: 5m
                description: Interval for drift detection checks. Defaults to "5m" (5 minutes).
                type: string
              retryPolicy:
                description: Retry policy for failed operations.
                nullable: true
                properties:
                  backoffSeconds:
                    default: 30
                    description: Base delay between retries in seconds.
                    format: uint32
                    minimum: 0.0
                    type: integer
                  maxRetries:
                    default: 3
                    description: Maximum number of retry attempts.
                    format: uint32
                    minimum: 0.0
                    type: integer
                type: object
              source:
                description: Source of the infrastructure template.
                properties:
                  configMapRef:
                    description: Reference to a ConfigMap containing the template.
                    nullable: true
                    properties:
                      key:
                        description: Key within the ConfigMap containing the template.
                        type: string
                      name:
                        description: Name of the ConfigMap.
                        type: string
                      namespace:
                        description: Namespace of the ConfigMap (defaults to same namespace as the InfrastructureTemplate).
                        nullable: true
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  gitRepository:
                    description: Reference to a Git repository containing the template.
                    nullable: true
                    properties:
                      path:
                        description: Path to the template file within the repository.
                        type: string
                      ref:
                        default: main
                        description: Git reference (branch, tag, or commit SHA).
                        type: string
                      secretRef:
                        description: Reference to a Secret containing Git credentials.
                        nullable: true
                        properties:
                          name:
                            description: Name of the Secret.
                            type: string
                          namespace:
                            description: Namespace of the Secret (defaults to same namespace as the resource).
                            nullable: true
                            type: string
                        required:
                        - name
                        type: object
                      url:
                        description: Git repository URL.
                        type: string
                    required:
                    - path
                    - url
                    type: object
                  inline:
                    description: Inline Ruby DSL template content.
                    nullable: true
                    type: string
                type: object
              suspend:
                default: false
                description: Suspend reconciliation for this template.
                type: boolean
              templateName:
                description: Optional specific template name to deploy if the source file contains multiple templates.
                nullable: true
                type: string
              variables:
                additionalProperties: true
                description: Variables to pass to the template during compilation.
                nullable: true
                type: object
            required:
            - pangeaNamespace
            - source
            type: object
          status:
            description: Status of an InfrastructureTemplate.
            nullable: true
            properties:
              compliance:
                description: Compliance check results.
                nullable: true
                properties:
                  failedControls:
                    description: Number of failed controls.
                    format: uint32
                    minimum: 0.0
                    type: integer
                  lastCheckAt:
                    description: Last compliance check timestamp.
                    format: date-time
                    type: string
                  passedControls:
                    description: Number of passed controls.
                    format: uint32
                    minimum: 0.0
                    type: integer
                  profiles:
                    description: Per-profile results.
                    items:
                      description: Result for a single compliance profile.
                      properties:
                        failedControlIds:
                          description: IDs of failed controls.
                          items:
                            type: string
                          type: array
                        profile:
                          description: Profile name.
                          type: string
                        score:
                          description: Profile score (0-100).
                          format: double
                          type: number
                        status:
                          description: Profile status (compliant, non-compliant).
                          type: string
                      required:
                      - profile
                      - score
                      - status
                      type: object
                    type: array
                  score:
                    description: Compliance score (0-100).
                    format: double
                    type: number
                  skippedControls:
                    description: Number of skipped controls.
                    format: uint32
                    minimum: 0.0
                    type: integer
                  status:
                    description: Overall compliance status.
                    type: string
                required:
                - failedControls
                - lastCheckAt
                - passedControls
                - score
                - skippedControls
                - status
                type: object
              conditions:
                description: Conditions representing the current state.
                items:
                  description: Kubernetes-style condition.
                  properties:
                    lastTransitionTime:
                      description: Last time the condition transitioned.
                      format: date-time
                      type: string
                    message:
                      description: Human-readable message.
                      type: string
                    reason:
                      description: Machine-readable reason for the condition.
                      type: string
                    status:
                      description: Status of the condition (True, False, Unknown).
                      type: string
                    type:
                      description: Type of condition.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              failureCount:
                default: 0
                description: Number of consecutive failures.
                format: uint32
                minimum: 0.0
                type: integer
              lastAppliedAt:
                description: Timestamp of the last successful apply.
                format: date-time
                nullable: true
                type: string
              lastAppliedRevision:
                description: Last successfully applied revision (content hash or git commit).
                nullable: true
                type: string
              lastDriftCheckAt:
                description: Timestamp of the last drift check.
                format: date-time
                nullable: true
                type: string
              lastError:
                description: Last error message if in Failed state.
                nullable: true
                type: string
              lastPlannedAt:
                description: Timestamp of the last successful plan.
                format: date-time
                nullable: true
                type: string
              observedGeneration:
                default: 0
                description: Last observed generation of the spec.
                format: int64
                type: integer
              outputs:
                additionalProperties: true
                description: Outputs from the last successful apply.
                nullable: true
                type: object
              phase:
                description: Current phase of the template lifecycle.
                enum:
                - Pending
                - Compiling
                - Initializing
                - Planning
                - Applying
                - Ready
                - Drifted
                - Failed
                - Destroying
                nullable: true
                type: string
              planSummary:
                description: Human-readable summary of the last plan.
                nullable: true
                type: string
              resources:
                description: Summary of managed resources.
                nullable: true
                properties:
                  added:
                    default: 0
                    description: Resources to be added in the pending plan.
                    format: uint32
                    minimum: 0.0
                    type: integer
                  changed:
                    default: 0
                    description: Resources to be changed in the pending plan.
                    format: uint32
                    minimum: 0.0
                    type: integer
                  destroyed:
                    default: 0
                    description: Resources to be destroyed in the pending plan.
                    format: uint32
                    minimum: 0.0
                    type: integer
                  total:
                    default: 0
                    description: Total number of managed resources.
                    format: uint32
                    minimum: 0.0
                    type: integer
                type: object
              stateKey:
                description: PostgreSQL state key path.
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: InfrastructureTemplate
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: pangeanamespaces.pangea.pleme.io
spec:
  group: pangea.pleme.io
  names:
    categories: []
    kind: PangeaNamespace
    plural: pangeanamespaces
    shortNames:
    - pns
    singular: pangeanamespace
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.backend.type
      name: Backend
      type: string
    - jsonPath: .status.templateCount
      name: Templates
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for PangeaNamespaceSpec via `CustomResource`
        properties:
          spec:
            description: PangeaNamespace is a cluster-scoped resource that configures a Pangea namespace with backend and default settings.
            properties:
              backend:
                description: State backend configuration.
                properties:
                  pg:
                    description: PostgreSQL backend configuration.
                    nullable: true
                    properties:
                      database:
                        description: Database name.
                        type: string
                      host:
                        description: PostgreSQL host.
                        type: string
                      pool:
                        description: Connection pool settings.
                        nullable: true
                        properties:
                          acquireTimeoutSecs:
                            default: 30
                            description: Connection acquire timeout in seconds.
                            format: uint64
                            minimum: 0.0
                            type: integer
                          idleTimeoutSecs:
                            default: 600
                            description: Idle connection timeout in seconds.
                            format: uint64
                            minimum: 0.0
                            type: integer
                          maxConnections:
                            default: 10
                            description: Maximum number of connections.
                            format: uint32
                            minimum: 0.0
                            type: integer
                          minConnections:
                            default: 2
                            description: Minimum number of connections.
                            format: uint32
                            minimum: 0.0
                            type: integer
                        type: object
                      port:
                        default: 5432
                        description: PostgreSQL port.
                        format: uint16
                        minimum: 0.0
                        type: integer
                      schemaPrefix:
                        default: pangea_
                        description: 'Schema name prefix (default: "pangea_").'
                        type: string
                      secretRef:
                        description: Reference to a Secret containing credentials.
                        properties:
                          caCertKey:
                            description: Key containing the CA certificate (optional).
                            nullable: true
                            type: string
                          name:
                            description: Name of the Secret.
                            type: string
                          namespace:
                            description: Namespace of the Secret.
                            nullable: true
                            type: string
                          passwordKey:
                            default: password
                            description: 'Key containing the password (default: "password").'
                            type: string
                          usernameKey:
                            default: username
                            description: 'Key containing the username (default: "username").'
                            type: string
                        required:
                        - name
                        type: object
                      sslMode:
                        default: verify-full
                        description: SSL mode for connections.
                        type: string
                    required:
                    - database
                    - host
                    - secretRef
                    type: object
                  s3:
                    description: S3 backend configuration (legacy, for migration).
                    nullable: true
                    properties:
                      bucket:
                        description: S3 bucket name.
                        type: string
                      dynamodbTable:
                        description: DynamoDB table for state locking.
                        nullable: true
                        type: string
                      keyPrefix:
                        description: Key prefix for state files.
                        nullable: true
                        type: string
                      region:
                        description: AWS region.
                        type: string
                      secretRef:
                        description: Reference to a Secret containing AWS credentials.
                        nullable: true
                        properties:
                          name:
                            description: Name of the Secret.
                            type: string
                          namespace:
                            description: Namespace of the Secret.
                            nullable: true
                            type: string
                        required:
                        - name
                        type: object
                    required:
                    - bucket
                    - region
                    type: object
                  type:
                    description: Type of backend (pg, s3, local).
                    enum:
                    - pg
                    - s3
                    - local
                    type: string
                required:
                - type
                type: object
              defaultComplianceProfiles:
                description: Default compliance profiles for templates in this namespace.
                items:
                  type: string
                type: array
              defaultProviders:
                description: Default provider configuration for templates in this namespace.
                nullable: true
                properties:
                  awsRegion:
                    description: Default AWS region.
                    nullable: true
                    type: string
                  awsSecretRef:
                    description: Default AWS credentials secret.
                    nullable: true
                    properties:
                      name:
                        description: Name of the Secret.
                        type: string
                      namespace:
                        description: Namespace of the Secret.
                        nullable: true
                        type: string
                    required:
                    - name
                    type: object
                  cloudflareSecretRef:
                    description: Default Cloudflare credentials secret.
                    nullable: true
                    properties:
                      name:
                        description: Name of the Secret.
                        type: string
                      namespace:
                        description: Namespace of the Secret.
                        nullable: true
                        type: string
                    required:
                    - name
                    type: object
                type: object
              defaultTags:
                additionalProperties:
                  type: string
                description: Default tags to apply to all resources in this namespace.
                type: object
              description:
                description: Description of this Pangea namespace.
                nullable: true
                type: string
            required:
            - backend
            type: object
          status:
            description: Status of a PangeaNamespace.
            nullable: true
            properties:
              backendReady:
                default: false
                description: Whether the backend is ready.
                type: boolean
              error:
                description: Error message if backend is not ready.
                nullable: true
                type: string
              lastVerifiedAt:
                description: Last time the backend was verified.
                format: date-time
                nullable: true
                type: string
              resourceStats:
                description: Resource statistics.
                nullable: true
                properties:
                  driftedTemplates:
                    description: Total templates with drift detected.
                    format: uint32
                    minimum: 0.0
                    type: integer
                  failedTemplates:
                    description: Total templates in Failed state.
                    format: uint32
                    minimum: 0.0
                    type: integer
                  readyTemplates:
                    description: Total templates in Ready state.
                    format: uint32
                    minimum: 0.0
                    type: integer
                  totalResources:
                    description: Total managed resources across all templates.
                    format: uint32
                    minimum: 0.0
                    type: integer
                required:
                - driftedTemplates
                - failedTemplates
                - readyTemplates
                - totalResources
                type: object
              schemaName:
                description: PostgreSQL schema name for this namespace.
                nullable: true
                type: string
              templateCount:
                default: 0
                description: Number of templates using this namespace.
                format: uint32
                minimum: 0.0
                type: integer
            type: object
        required:
        - spec
        title: PangeaNamespace
        type: object
    served: true
    storage: true
    subresources:
      status: {}
