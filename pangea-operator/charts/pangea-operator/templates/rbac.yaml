{{- if .Values.serviceAccount.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "pangea-operator.fullname" . }}
  labels:
    {{- include "pangea-operator.labels" . | nindent 4 }}
rules:
  # InfrastructureTemplate resources
  - apiGroups:
      - pangea.pleme.io
    resources:
      - infrastructuretemplates
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - pangea.pleme.io
    resources:
      - infrastructuretemplates/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - pangea.pleme.io
    resources:
      - infrastructuretemplates/finalizers
    verbs:
      - update

  # PangeaNamespace resources
  - apiGroups:
      - pangea.pleme.io
    resources:
      - pangeanamespaces
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - pangea.pleme.io
    resources:
      - pangeanamespaces/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - pangea.pleme.io
    resources:
      - pangeanamespaces/finalizers
    verbs:
      - update

  # ConfigMaps for template sources
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch

  # Secrets for credentials
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch

  # Events for status reporting
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch

  # M1 — ArchitectureGem (typed registry of pangea-* gems)
  - apiGroups:
      - pangea.pleme.io
    resources:
      - architecturegems
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - pangea.pleme.io
    resources:
      - architecturegems/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - pangea.pleme.io
    resources:
      - architecturegems/finalizers
    verbs:
      - update

  # M3 — WorkspaceCatalog (typed registry of operator-watched workspaces +
  # workspace-level cascade policy)
  - apiGroups:
      - pangea.pleme.io
    resources:
      - workspacecatalogs
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - pangea.pleme.io
    resources:
      - workspacecatalogs/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - pangea.pleme.io
    resources:
      - workspacecatalogs/finalizers
    verbs:
      - update

  # PangeaAlert — declare-once alert rules; the AlertController reconciles
  # each into an owned VMRule / PrometheusRule and self-patches status.
  - apiGroups:
      - pangea.pleme.io
    resources:
      - pangeaalerts
      - pangeaalerts/status
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # Alert-rule CRs the AlertController renders + owns via ownerReference:
  # VMRule (operator.victoriametrics.com, the default) and PrometheusRule
  # (monitoring.coreos.com). Without these the controller 403s on upsert.
  - apiGroups:
      - operator.victoriametrics.com
    resources:
      - vmrules
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - monitoring.coreos.com
    resources:
      - prometheusrules
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # Leader election
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "pangea-operator.fullname" . }}
  labels:
    {{- include "pangea-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "pangea-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "pangea-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
