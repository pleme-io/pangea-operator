{{- if .Values.serviceAccount.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "pangea-operator.fullname" . }}
  labels:
    {{- include "pangea-operator.labels" . | nindent 4 }}
rules:
  # InfrastructureTemplate resources
  - apiGroups:
      - pangea.pleme.io
    resources:
      - infrastructuretemplates
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - pangea.pleme.io
    resources:
      - infrastructuretemplates/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - pangea.pleme.io
    resources:
      - infrastructuretemplates/finalizers
    verbs:
      - update

  # PangeaNamespace resources
  - apiGroups:
      - pangea.pleme.io
    resources:
      - pangeanamespaces
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - pangea.pleme.io
    resources:
      - pangeanamespaces/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - pangea.pleme.io
    resources:
      - pangeanamespaces/finalizers
    verbs:
      - update

  # ConfigMaps for template sources
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch

  # Secrets for credentials
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch

  # Events for status reporting
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch

  # M1 — ArchitectureGem (typed registry of pangea-* gems)
  - apiGroups:
      - pangea.pleme.io
    resources:
      - architecturegems
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - pangea.pleme.io
    resources:
      - architecturegems/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - pangea.pleme.io
    resources:
      - architecturegems/finalizers
    verbs:
      - update

  # M3 — WorkspaceCatalog (typed registry of operator-watched workspaces +
  # workspace-level cascade policy)
  - apiGroups:
      - pangea.pleme.io
    resources:
      - workspacecatalogs
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - pangea.pleme.io
    resources:
      - workspacecatalogs/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - pangea.pleme.io
    resources:
      - workspacecatalogs/finalizers
    verbs:
      - update

  # Leader election
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "pangea-operator.fullname" . }}
  labels:
    {{- include "pangea-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "pangea-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "pangea-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
