apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pangea-operator.fullname" . }}
  labels:
    {{- include "pangea-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "pangea-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "pangea-operator.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "pangea-operator.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: operator
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # ── ★ THE LEADER LEASE LIVES WHERE THE OPERATOR RUNS ──────────
            # `leader.rs:94-97` reads POD_NAMESPACE and falls back to the
            # literal "pangea-system", while `leader.rs:59` documents the
            # intent as "the operator's OWN namespace". Nothing injected
            # POD_NAMESPACE, so the fallback was always in force — and it is
            # only correct on a cluster that happens to have a namespace by
            # that name.
            #
            # MEASURED 2026-08-05: rio has `pangea-system` (Active) and works.
            # camelot runs this chart in namespace `camelot`, has no
            # `pangea-system`, and the operator sat in an infinite retry:
            #   Leader election acquire attempt failed — retrying
            #   namespaces "pangea-system" not found: NotFound (404)
            # every ~3s since install. It never became leader, so it
            # reconciled NOTHING: all 16 InfrastructureTemplates on camelot
            # carried no phase, no resources, no cycle — including the
            # `pleme-io-opensource` CR that owns the GitHub org's posture.
            #
            # The pod was 1/1 Running and the HelmRelease said "Helm upgrade
            # succeeded" throughout, so every surface an operator checks was
            # green while the control plane converged nothing.
            #
            # The downward API is the canonical fix and matches the code's
            # stated intent: the lease belongs in the namespace the operator
            # actually runs in, whatever that is, so the chart stops being
            # silently coupled to one namespace NAME.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RUST_LOG
              value: {{ .Values.config.logLevel | quote }}
            - name: LOG_FORMAT
              value: {{ .Values.config.logFormat | quote }}
            - name: HEALTH_ADDR
              value: {{ .Values.config.healthAddr | quote }}
            - name: METRICS_ADDR
              value: {{ .Values.config.metricsAddr | quote }}
            - name: GRAPHQL_ADDR
              value: {{ .Values.config.graphqlAddr | quote }}
            - name: GRPC_ADDR
              value: {{ .Values.config.grpcAddr | quote }}
            {{- if .Values.config.otelEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.config.otelEndpoint | quote }}
            {{- end }}
            {{- if .Values.auth.enabled }}
            - name: PANGEA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | default (printf "%s-auth" (include "pangea-operator.fullname" .)) }}
                  key: {{ .Values.auth.secretKey }}
            {{- end }}
          ports:
            - name: health
              containerPort: {{ .Values.service.ports.health }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.service.ports.metrics }}
              protocol: TCP
            - name: graphql
              containerPort: {{ .Values.service.ports.graphql }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.service.ports.grpc }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        {{- if .Values.compilerSidecar.enabled }}
        - name: compiler
          image: "{{ .Values.compilerSidecar.image.repository }}:{{ .Values.compilerSidecar.image.tag }}"
          imagePullPolicy: {{ .Values.compilerSidecar.image.pullPolicy }}
          resources:
            {{- toYaml .Values.compilerSidecar.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
