                - Pending
                - Loading
                - SmokeTesting
                - Loaded
                - Failed
                - Suspended
                nullable: true
                type: string
              smokeStatus:
                description: Smoke test outcome.
                enum:
                - NotRun
                - Passed
                - Failed
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: ArchitectureGem
        type: object
