            properties:
              expectedClasses:
                description: |-
                  Classes the operator EXPECTS this gem to expose. Operator refuses to advance past `Verifying` if any expected class is missing from the compiler's loaded namespace.

                  Format: fully-qualified Ruby class names, e.g. `Pangea::Architectures::CloudflareTunnel`.
