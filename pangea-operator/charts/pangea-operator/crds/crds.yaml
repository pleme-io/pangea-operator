                  description: Smoke-test fixture for one architecture class. The compiler runs the architecture's `.build(...)` method against the inputs and confirms the result compiles to valid Terraform JSON.
                  properties:
                    className:
                      description: Fully-qualified class name being exercised. E.g. `Pangea::Architectures::CloudflareTunnel`.
                      type: string
                    description:
                      description: Optional human-readable description shown in error messages when the fixture fails.
                      nullable: true
                      type: string
                    fixturePath:
                      description: 'Path to the fixture input file, relative to the gem''s repository root. Format is YAML; the YAML is deserialized as the architecture''s `.build(synth, args)` second argument. Example: `spec/fixtures/cloudflare_tunnel.yaml`.'
                      type: string
                  required:
                  - className
                  - fixturePath
                  type: object
                type: array
              gemName:
                description: 'Ruby gem name as it appears in Bundler / require statements. Example: `pangea-architectures`.'
