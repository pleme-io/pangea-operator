apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: operatorpolicies.pangea.pleme.io
spec:
  group: pangea.pleme.io
  names:
    categories:
    - pangea
    kind: OperatorPolicy
    plural: operatorpolicies
    shortNames:
    - oppol
    singular: operatorpolicy
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.globalSuspend
      name: GlobalSuspend
      type: boolean
    - jsonPath: .spec.globalSuspendReason
      name: Reason
      type: string
    - jsonPath: .status.reconcilesSkipped
      name: Skipped
      type: integer
    - jsonPath: .status.workspaceOverrides
      name: WorkspaceOverrides
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for OperatorPolicySpec via `CustomResource`
        properties:
          spec:
            description: Cluster-scoped fleet-wide kill-switch for the operator's controllers.
            properties:
              controllerSuspend:
                default:
                  amiTest: false
                  architectureGem: false
                  complianceBinding: false
                  complianceSchedule: false
                  dashboard: false
                  flow: false
                  imagePipeline: false
                  namespace: false
                  packerBuild: false
                  synthesizerFormat: false
                  template: false
                  workspaceCatalog: false
                description: Per-controller suspend. Use to pause a specific controller while debugging without freezing the whole operator. `globalSuspend` dominates this field — if it's true, per-controller flags are not consulted.
                properties:
                  amiTest:
                    default: false
                    description: Pause `ami_test_controller`.
                    type: boolean
                  architectureGem:
                    default: false
                    description: Pause `architecture_gem_controller`.
                    type: boolean
                  complianceBinding:
                    default: false
                    description: Pause `compliance_binding_controller`.
                    type: boolean
                  complianceSchedule:
                    default: false
                    description: Pause `compliance_schedule_controller`.
                    type: boolean
                  dashboard:
                    default: false
                    description: Pause `dashboard_controller` (PangeaDashboard).
                    type: boolean
                  flow:
                    default: false
                    description: Pause `flow_controller` (InfrastructureFlow).
                    type: boolean
                  imagePipeline:
                    default: false
                    description: Pause `image_pipeline_controller`.
                    type: boolean
                  namespace:
                    default: false
                    description: Pause `namespace_controller` (PangeaNamespace).
                    type: boolean
                  packerBuild:
                    default: false
                    description: Pause `packer_build_controller`.
                    type: boolean
                  synthesizerFormat:
                    default: false
                    description: Pause `synthesizer_format_controller`.
                    type: boolean
                  template:
                    default: false
                    description: Pause `template_controller` (InfrastructureTemplate).
                    type: boolean
                  workspaceCatalog:
                    default: false
                    description: Pause `workspace_catalog_controller`.
                    type: boolean
                type: object
              globalSuspend:
                default: false
                description: Master kill-switch. When true, every operator controller skips reconciliation entirely. Status counter `reconcilesSkipped` increments on every skipped reconcile so you can verify the pause is taking effect.
                type: boolean
              globalSuspendReason:
                description: 'Operator-readable reason for the suspend, surfaced in: * structured logs on every skipped reconcile * Kubernetes Events with reason=`OperatorSuspended` * `kubectl describe operatorpolicy default` output'
                nullable: true
                type: string
              workspaceSuspend:
                default: {}
                description: |-
                  Per-workspace tri-state suspend. Specific overrides general: the resolution ladder for a single template is

                  1. `workspaceSuspend.templates["<ns>/<name>"].state` 2. `workspaceSuspend.catalogs["<owner-catalog>"].state` (cascade — catalog Active carves the entire catalog out of a global pause, catalog Paused freezes everything under it) 3. `controllerSuspend.template` 4. `globalSuspend`

                  stopping at the first non-`Inherit` decision. `Active` at any of layers 1–2 means "specifically configured to reconcile during a global pause" — a surgical carve-out. `Paused` at any of layers 1–2 freezes that workspace regardless of more general state.
                properties:
                  catalogs:
                    additionalProperties:
                      description: 'A single per-workspace decision: what state, optionally why.'
                      properties:
                        reason:
                          description: Optional human-readable note, surfaced in skip logs and the `policy_skipped_total{reason=...}` metric label. Optional throughout the surface — pausing without a reason is allowed, dashboards display "(no reason given)".
                          nullable: true
                          type: string
                        state:
                          default: inherit
                          description: Tri-state decision. Defaults to `Inherit`, which is equivalent to omitting the entry entirely.
                          enum:
                          - inherit
                          - paused
                          - active
                          type: string
                      type: object
                    description: Per-catalog overrides keyed by `WorkspaceCatalog` name. Cascades to children unless a child template overrides.
                    type: object
                  templates:
                    additionalProperties:
                      description: 'A single per-workspace decision: what state, optionally why.'
                      properties:
                        reason:
                          description: Optional human-readable note, surfaced in skip logs and the `policy_skipped_total{reason=...}` metric label. Optional throughout the surface — pausing without a reason is allowed, dashboards display "(no reason given)".
                          nullable: true
                          type: string
                        state:
                          default: inherit
                          description: Tri-state decision. Defaults to `Inherit`, which is equivalent to omitting the entry entirely.
                          enum:
                          - inherit
                          - paused
                          - active
                          type: string
                      type: object
                    description: Per-template overrides keyed `"<namespace>/<name>"`.
                    type: object
                type: object
            type: object
          status:
            description: Status of an OperatorPolicy. The reconciler mirrors `spec` into `status.effective` after every spec change so consumers can observe the policy's resolved view without re-reading spec.
            nullable: true
            properties:
              effective:
                description: Effective view of the spec. Mirrors spec verbatim today; reserved for future computed fields (e.g., merged-from-multiple-sources).
                nullable: true
                properties:
                  controllerSuspend:
                    default:
                      amiTest: false
                      architectureGem: false
                      complianceBinding: false
                      complianceSchedule: false
                      dashboard: false
                      flow: false
                      imagePipeline: false
                      namespace: false
                      packerBuild: false
                      synthesizerFormat: false
                      template: false
                      workspaceCatalog: false
                    description: Per-controller suspend. Use to pause a specific controller while debugging without freezing the whole operator. `globalSuspend` dominates this field — if it's true, per-controller flags are not consulted.
                    properties:
                      amiTest:
                        default: false
                        description: Pause `ami_test_controller`.
                        type: boolean
                      architectureGem:
                        default: false
                        description: Pause `architecture_gem_controller`.
                        type: boolean
                      complianceBinding:
                        default: false
                        description: Pause `compliance_binding_controller`.
                        type: boolean
                      complianceSchedule:
                        default: false
                        description: Pause `compliance_schedule_controller`.
                        type: boolean
                      dashboard:
                        default: false
                        description: Pause `dashboard_controller` (PangeaDashboard).
                        type: boolean
                      flow:
                        default: false
                        description: Pause `flow_controller` (InfrastructureFlow).
                        type: boolean
                      imagePipeline:
                        default: false
                        description: Pause `image_pipeline_controller`.
                        type: boolean
                      namespace:
                        default: false
                        description: Pause `namespace_controller` (PangeaNamespace).
                        type: boolean
                      packerBuild:
                        default: false
                        description: Pause `packer_build_controller`.
                        type: boolean
                      synthesizerFormat:
                        default: false
                        description: Pause `synthesizer_format_controller`.
                        type: boolean
                      template:
                        default: false
                        description: Pause `template_controller` (InfrastructureTemplate).
                        type: boolean
                      workspaceCatalog:
                        default: false
                        description: Pause `workspace_catalog_controller`.
                        type: boolean
                    type: object
                  globalSuspend:
                    default: false
                    description: Master kill-switch. When true, every operator controller skips reconciliation entirely. Status counter `reconcilesSkipped` increments on every skipped reconcile so you can verify the pause is taking effect.
                    type: boolean
                  globalSuspendReason:
                    description: 'Operator-readable reason for the suspend, surfaced in: * structured logs on every skipped reconcile * Kubernetes Events with reason=`OperatorSuspended` * `kubectl describe operatorpolicy default` output'
                    nullable: true
                    type: string
                  workspaceSuspend:
                    default: {}
                    description: |-
                      Per-workspace tri-state suspend. Specific overrides general: the resolution ladder for a single template is

                      1. `workspaceSuspend.templates["<ns>/<name>"].state` 2. `workspaceSuspend.catalogs["<owner-catalog>"].state` (cascade — catalog Active carves the entire catalog out of a global pause, catalog Paused freezes everything under it) 3. `controllerSuspend.template` 4. `globalSuspend`

                      stopping at the first non-`Inherit` decision. `Active` at any of layers 1–2 means "specifically configured to reconcile during a global pause" — a surgical carve-out. `Paused` at any of layers 1–2 freezes that workspace regardless of more general state.
                    properties:
                      catalogs:
                        additionalProperties:
                          description: 'A single per-workspace decision: what state, optionally why.'
                          properties:
                            reason:
                              description: Optional human-readable note, surfaced in skip logs and the `policy_skipped_total{reason=...}` metric label. Optional throughout the surface — pausing without a reason is allowed, dashboards display "(no reason given)".
                              nullable: true
                              type: string
                            state:
                              default: inherit
                              description: Tri-state decision. Defaults to `Inherit`, which is equivalent to omitting the entry entirely.
                              enum:
                              - inherit
                              - paused
                              - active
                              type: string
                          type: object
                        description: Per-catalog overrides keyed by `WorkspaceCatalog` name. Cascades to children unless a child template overrides.
                        type: object
                      templates:
                        additionalProperties:
                          description: 'A single per-workspace decision: what state, optionally why.'
                          properties:
                            reason:
                              description: Optional human-readable note, surfaced in skip logs and the `policy_skipped_total{reason=...}` metric label. Optional throughout the surface — pausing without a reason is allowed, dashboards display "(no reason given)".
                              nullable: true
                              type: string
                            state:
                              default: inherit
                              description: Tri-state decision. Defaults to `Inherit`, which is equivalent to omitting the entry entirely.
                              enum:
                              - inherit
                              - paused
                              - active
                              type: string
                          type: object
                        description: Per-template overrides keyed `"<namespace>/<name>"`.
                        type: object
                    type: object
                type: object
              lastChangedAt:
                description: Wall-clock timestamp of the last spec change observed by the controller. Empty until the policy is first reconciled.
                format: date-time
                nullable: true
                type: string
              observedGeneration:
                default: 0
                description: Last `metadata.generation` the controller has reconciled.
                format: int64
                type: integer
              reconcilesSkipped:
                default: 0
                description: |-
                  Rolling counter — read this as the **last-snapshot** value, not the live count. Since the rio firefighting 2026-05-07 wave (see `operator_policy_controller::status_needs_patch`) the OperatorPolicy status PATCH is diff-gated on substantive changes only, so this field is updated only when something material on the policy itself changes (`observedGeneration`, `effective` spec, or the `workspaceOverrides` count). The in-memory atomic counter the controller reads from (`OperatorPolicyCache.skipped`) is sampled into here at write time; between writes, the field is frozen.

                  **For the live count** (every increment as it happens), use the Prometheus counter `pangea_policy_skipped_total{controller, source, reason, target}`. It carries label dimensions this CR field can't (which controller skipped, which gate fired, which workspace) and is the canonical source for the chart 0.8.14 `PangeaControllerReconcileRateHigh` alert.

                  At-a-glance usage (still useful for a single-shot manual check): `kubectl get operatorpolicy default -o jsonpath='{.status.reconcilesSkipped}'` Live rate (Prometheus): `sum by (controller) (rate(pangea_policy_skipped_total[1m]))`

                  Resets to zero on operator restart (the in-memory counter is non-persistent; this field is overwritten by the next substantive PATCH).
                format: uint64
                minimum: 0.0
                type: integer
              workspaceOverrides:
                default: 0
                description: Number of `Active` workspace carve-outs currently in effect (templates + catalogs combined). Surfaced as a printer column so `kubectl get oppol` shows at a glance how many surgical exemptions exist while a global pause is in place. Counted directly from `spec.workspaceSuspend`; not a runtime gauge.
                format: uint64
                minimum: 0.0
                type: integer
            type: object
        required:
        - spec
        title: OperatorPolicy
        type: object
    served: true
    storage: true
    subresources:
      status: {}
