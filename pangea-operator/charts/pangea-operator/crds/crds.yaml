                format: date-time
                nullable: true
                type: string
              loadedClassCount:
                default: 0
                description: '`loadedClasses.len()` — exposed as a printer column for `kubectl get archgem` ergonomics.'
                format: uint32
                minimum: 0.0
                type: integer
              loadedClasses:
