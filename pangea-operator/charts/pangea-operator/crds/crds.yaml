                type: array
              missingClasses:
                default: []
                description: Classes from `spec.expectedClasses` that are MISSING from the compiler's namespace. Empty when the gem is fully loaded.
                items:
                  type: string
                type: array
              observedVersion:
                description: Compiler-reported gem version (compared against `spec.version`).
                nullable: true
                type: string
              phase:
                description: Lifecycle phase. See `Phase` enum.
