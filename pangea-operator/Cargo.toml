[package]
name = "pangea-operator"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Rust-based Kubernetes operator for Pangea infrastructure management"
license.workspace = true
repository.workspace = true

[features]
default = ["graphql", "grpc"]
graphql = ["async-graphql", "async-graphql-axum"]
grpc = ["tonic", "prost"]
# In-process CRuby evaluator (M8.2 of the hollow-out plan). When OFF (the
# default until M8.4 burn-in), the operator only dispatches to the
# pangea-compiler sidecar over HTTP. When ON, the operator additionally
# spawns a Ruby owner thread + can be configured (via PANGEA_COMPILER_BACKEND
# env or helm useEmbeddedRuby flag) to evaluate templates in-process.
# Pulls in pangea-ruby-eval which links libruby — only enable in builds
# where CRuby is available (Linux container image, dev shell).
embedded_ruby = ["dep:pangea-ruby-eval"]

[dependencies]
# Shared types
pangea-types = { workspace = true, features = ["server"] }

# In-process Ruby evaluator (feature-gated; see [features].embedded_ruby).
pangea-ruby-eval = { path = "../pangea-ruby-eval", optional = true }

# Kubernetes
kube = { workspace = true, features = ["runtime", "client"] }
k8s-openapi.workspace = true

# Async runtime
tokio = { workspace = true, features = ["signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"

# Drain coordinator — SIGTERM/SIGINT handling shared across pleme-io daemons
tsunagu = { git = "https://github.com/pleme-io/tsunagu" }

# Web framework
axum = { workspace = true, features = ["tokio"] }
tower.workspace = true
tower-http.workspace = true

# GraphQL (optional)
async-graphql = { workspace = true, features = ["chrono", "uuid"], optional = true }
async-graphql-axum = { workspace = true, optional = true }

# gRPC (optional)
tonic = { version = "0.12", optional = true }
prost = { version = "0.13", optional = true }
prost-types = "0.13"

# Database
sqlx = { workspace = true, features = ["tls-rustls", "chrono", "uuid"] }

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"

# Observability
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry = "0.27"
opentelemetry = { version = "0.27", features = ["trace"] }
opentelemetry-otlp = { version = "0.27", features = ["tonic"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
prometheus = "0.13"

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# HTTP client (for compiler sidecar)
reqwest.workspace = true

# Regex — used by the per-resource policy engine for `addressPattern`
# matching. Already pulled in transitively by tracing-subscriber et al.
regex = "1"

# Utilities
chrono = { workspace = true, features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
urlencoding = "2"
tempfile = "3"
rand = "0.8"
once_cell = "1"
derive_builder = "0.20"
strum = { version = "0.26", features = ["derive"] }
async-trait = "0.1"

# JSON Schema for CRDs
schemars.workspace = true

[build-dependencies]
tonic-build = { version = "0.12", optional = true }
prost-build = { version = "0.13", optional = true }

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
rstest = "0.24"
pretty_assertions = "1"

[[bin]]
name = "pangea-operator"
path = "src/main.rs"
