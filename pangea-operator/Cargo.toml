[package]
name = "pangea-operator"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Rust-based Kubernetes operator for Pangea infrastructure management"
license.workspace = true
repository.workspace = true

[features]
default = ["graphql", "grpc"]
graphql = ["async-graphql", "async-graphql-axum"]
grpc = ["tonic", "prost"]

[dependencies]
# Shared types
pangea-types = { workspace = true, features = ["server"] }

# Kubernetes
kube = { workspace = true, features = ["runtime", "client"] }
k8s-openapi.workspace = true

# Async runtime
tokio = { workspace = true, features = ["signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"

# Web framework
axum = { workspace = true, features = ["tokio"] }
tower.workspace = true
tower-http.workspace = true

# GraphQL (optional)
async-graphql = { workspace = true, features = ["chrono", "uuid"], optional = true }
async-graphql-axum = { workspace = true, optional = true }

# gRPC (optional)
tonic = { version = "0.12", optional = true }
prost = { version = "0.13", optional = true }
prost-types = "0.13"

# Database
sqlx = { workspace = true, features = ["tls-rustls", "chrono", "uuid"] }

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"

# Observability
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry = "0.27"
opentelemetry = { version = "0.27", features = ["trace"] }
opentelemetry-otlp = { version = "0.27", features = ["tonic"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
prometheus = "0.13"

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# HTTP client (for compiler sidecar)
reqwest.workspace = true

# Utilities
chrono = { workspace = true, features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
urlencoding = "2"
tempfile = "3"
rand = "0.8"
once_cell = "1"
derive_builder = "0.20"
strum = { version = "0.26", features = ["derive"] }
async-trait = "0.1"

# JSON Schema for CRDs
schemars.workspace = true

[build-dependencies]
tonic-build = { version = "0.12", optional = true }
prost-build = { version = "0.13", optional = true }

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
rstest = "0.24"
pretty_assertions = "1"

[[bin]]
name = "pangea-operator"
path = "src/main.rs"
