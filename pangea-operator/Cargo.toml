[package]
name = "pangea-operator"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Rust-based Kubernetes operator for Pangea infrastructure management"
license.workspace = true
repository.workspace = true

[features]
# embedded_ruby + executor_magma are DEFAULT (2026-06-02): the sidecar is
# sunset, magnus is the only compiler backend, and magma is the canonical
# executor. gen resolves DEFAULT features into Cargo.build-spec.json — the
# rootFeatures arg to mkCrate2nixDockerImage is NOT honored by the
# gen/lockfile-builder path, so a non-default feature never reaches the image
# build (this is why the operator silently shipped HTTP-sidecar + Tofu-only).
# Making them default is the load-bearing fix: every build now links libruby
# (use the `.#ruby-eval` devshell) + compiles MagmaExecutor in.
#
# ── THE RUBY-FREE BUILD, and why it is not the default yet (2026-08-11) ──
#
# `--no-default-features --features graphql,grpc,executor_magma` compiles
# clean and passes the full suite (1330 tests, verified 2026-08-11). That
# configuration is what the FedRAMP boundary needs — it cannot receive Ruby —
# and it is also what unlocks distroless-STATIC, because libruby is
# dynamically linked (magnus/rb-sys) and is the sole reason this image is
# built against plain glibc nixpkgs instead of the musl-static cross target
# every other binary in this repo already uses.
#
# Inverting these defaults is the ONLY lever that reaches the image, since
# rootFeatures is not honored and there is no way to ask that path for FEWER
# features than the default set. But inverting alone is a live break, not an
# improvement:
#
#   config.rs's prescribed default is `compiler.backend = "embedded"`, and
#   main.rs deliberately PANICS on `embedded` when the feature is absent
#   rather than silently falling back to the sunset HTTP sidecar. So flipping
#   the default crashes the operator on startup for every deployment that has
#   not already migrated — camelot included, which is serving 18 Ruby-backed
#   PangeaDashboard CRs today.
#
# The order that works is: publish BOTH image variants first (a `-noruby` tag
# beside the current one), migrate the CRs to the tlisp/architecture source
# shapes, then invert. Two-variant publishing needs either a gen fix so
# rootFeatures reaches the image, or a second committed build spec.
# ── ★ RUBY-FREE BY DEFAULT (2026-08-23) ─────────────────────────────────
# `embedded_ruby` and `magma_rubygems` are both OPT-IN now. Turning either
# on is still one flag — `--features embedded_ruby` — so the Ruby build is
# available, it is simply no longer what you get by not choosing.
#
# What changed to make this safe, because the note above correctly said it
# was not: config.rs prescribed `compiler.backend = "embedded"` as a fixed
# literal while main.rs PANICS on `embedded` without the feature, so
# inverting used to crash every unmigrated deployment on startup. The
# prescription now follows the feature (config.rs DEFAULT_COMPILER_BACKEND),
# so a Ruby-free binary prescribes `lava`, which it can always construct.
#
# And lava can now do the job it could not: LavaCompilerBackend::compile
# renders `(deflava-architecture …)` to terraform.json, and
# list_architectures enumerates the image catalogue. Those were the two
# typed gaps that made a Ruby-free operator undeployable rather than merely
# unbuilt.
#
# BOTH are dropped, not just embedded_ruby: magma_rubygems pulls Ruby into
# the closure on its own — measured, dropping embedded_ruby alone took the
# operator from 76 runtime deps to 75 and left Ruby among them. Removing
# embedded_ruby is necessary and not sufficient.
#
# What an image loses by default: `compute_gem_tree_attestation` returns
# None, so a Gemfile.lock in a workspace is not attested. On a boundary that
# cannot run Ruby there is no Gemfile to attest, and a build that wants both
# asks for `magma_rubygems` explicitly.
default = ["graphql", "grpc", "executor_magma"]
graphql = ["async-graphql", "async-graphql-axum"]
grpc = ["tonic", "prost"]
# In-process CRuby evaluator (M8.2 of the hollow-out plan). When OFF (the
# default until M8.4 burn-in), the operator only dispatches to the
# pangea-compiler sidecar over HTTP. When ON, the operator additionally
# spawns a Ruby owner thread + can be configured (via PANGEA_COMPILER_BACKEND
# env or helm useEmbeddedRuby flag) to evaluate templates in-process.
# Pulls in pangea-ruby-eval which links libruby — only enable in builds
# where CRuby is available (Linux container image, dev shell).
embedded_ruby = ["dep:pangea-ruby-eval"]
# Gem-lockfile attestation, split out of `executor_magma` (2026-08-11).
#
# magma-rubygems links libruby through magnus/rb-sys exactly as
# pangea-ruby-eval does, so while it rode inside `executor_magma` a build
# with embedded_ruby OFF still pulled Ruby into the closure — measured:
# dropping embedded_ruby took the operator from 76 runtime deps to 75 and
# left magma_rubygems among them. Removing embedded_ruby is NECESSARY but
# not SUFFICIENT for a Ruby-free image; this is the other half.
#
# It stays in `default`, so nothing changes for anyone who does not
# deliberately subtract it. The Ruby-free variant spec omits it, which is
# what lets that image reach musl-static and therefore distroless-static.
#
# What is lost when it is off: `compute_gem_tree_attestation` returns
# None, so a Gemfile.lock in a workspace is not attested. That is the
# right trade for a boundary that cannot run Ruby at all — there is no
# Gemfile there to attest.
magma_rubygems = ["dep:magma-rubygems"]
# Magma-backed IacExecutor (alternative to TofuExecutor). When OFF
# (the default) the operator only ships `TofuExecutor`. When ON,
# `MagmaExecutor` is also compiled in and is selectable per-CR or
# via PANGEA_EXECUTOR=magma. Pulls in the magma library suite
# (in-process plan/apply/state). Per
# theory/MAGMA-OPERATOR-BACKEND.md §V (M0.10–M0.15).
executor_magma = [
    "dep:magma-backend",
    "dep:magma-config",
    "dep:magma-plan",
    "dep:magma-apply",
    "dep:magma-state",
    "dep:magma-types",
    "dep:magma-operator-backend",
    "dep:magma-test-laws",
    "dep:magma-drift",
    "dep:magma-converge",
    "dep:magma-bundle",
    "dep:magma-fsm",
    "dep:magma-stream",
    "dep:hex",
]

[dependencies]
lava-core = { git = "https://github.com/pleme-io/lava-core", rev = "f7530d06a52c3356d81415c6611c5ccd2c8cbd06" }
lava-eval = { git = "https://github.com/pleme-io/lava-eval", rev = "1b8959e92067e1bbbaa3dfad4b54d4a79098de69" }
# Shared types
pangea-types = { workspace = true, features = ["server"] }

# Typed-dispatcher catalog integration
gen-platform = { workspace = true }
gen-types = { workspace = true }

# Convergence primitives — CascadePolicy for the reactive-policy cascade.
shigoto-types = { workspace = true }

# Scheduling substrate — the controller's fair-priority ranking
# (controller::scheduling) and typed dependency DAGs (controller::
# template_dag, controller::flow_scheduler) delegate to these rather than
# hand-rolling the algorithm locally. See controller/scheduling.rs's module
# doc for the full split (ranking -> shigoto-rank, admission -> shigoto-
# budget, topology -> shigoto-dag).
shigoto-dag = { workspace = true }
shigoto-budget = { workspace = true }
shigoto-rank = { workspace = true }

# In-process Ruby evaluator (feature-gated; see [features].embedded_ruby).
pangea-ruby-eval = { path = "../pangea-ruby-eval", optional = true }

# PINNED, and the pin is the point. These were `git =` with no `rev` while
# `shigoto` three lines above was pinned, so a routine `cargo update` moved
# the LIVE operator's IaC executor with nothing asking for it. Observed
# 2026-08-02: both Cargo.lock and Cargo.gen.lock drifted 54c1307 -> 13e8485
# unbidden during an unrelated change. Reverted before it shipped, but the
# next lock refresh would have done it again.
#
# This rev is what camelot-eks is running. Bumping magma is now an explicit
# commit that says so, which is the only safe shape for the component that
# applies real cloud infrastructure.
# Magma library suite (feature-gated; see [features].executor_magma).
# Per theory/MAGMA-OPERATOR-BACKEND.md — every reconcile runs as
# in-process Rust calls when MagmaExecutor is selected. Both
# TofuExecutor and MagmaExecutor coexist; selection is per-CR.
magma-backend          = { git = "https://github.com/pleme-io/magma", rev = "af94559ea32f1ed132c9dda5c82618635e6e910e", optional = true }
magma-config           = { git = "https://github.com/pleme-io/magma", rev = "af94559ea32f1ed132c9dda5c82618635e6e910e", optional = true }
magma-plan             = { git = "https://github.com/pleme-io/magma", rev = "af94559ea32f1ed132c9dda5c82618635e6e910e", optional = true }
magma-apply            = { git = "https://github.com/pleme-io/magma", rev = "af94559ea32f1ed132c9dda5c82618635e6e910e", optional = true }
magma-state            = { git = "https://github.com/pleme-io/magma", rev = "af94559ea32f1ed132c9dda5c82618635e6e910e", optional = true }
magma-types            = { git = "https://github.com/pleme-io/magma", rev = "af94559ea32f1ed132c9dda5c82618635e6e910e", optional = true }
magma-operator-backend = { git = "https://github.com/pleme-io/magma", rev = "af94559ea32f1ed132c9dda5c82618635e6e910e", optional = true }
# Universal substrate law battery — used as preflight before plan/apply
# so malformed workspaces fail loudly instead of reaching the live
# backend. See theory/TESTING-SUBSTRATE.md.
magma-test-laws        = { git = "https://github.com/pleme-io/magma", rev = "af94559ea32f1ed132c9dda5c82618635e6e910e", optional = true, features = ["preflight"] }
# Drift classification + DriftPolicy — every plan is classified per
# the configured policy so operators can route AutoCorrect /
# AutoCorrectWithAlert / RequireApproval / Refuse anomalies.
magma-drift            = { git = "https://github.com/pleme-io/magma", rev = "af94559ea32f1ed132c9dda5c82618635e6e910e", optional = true }
# Universal Change / Plan / Action types (needed for drift conversion).
magma-converge         = { git = "https://github.com/pleme-io/magma", rev = "af94559ea32f1ed132c9dda5c82618635e6e910e", optional = true }
# Typed compliance artifact — every reconcile produces a BLAKE3-attested
# Bundle carrying plan + drift + lifecycle, written to disk between
# plan and apply for compliance export + restart-safe handoff.
magma-bundle           = { git = "https://github.com/pleme-io/magma", rev = "af94559ea32f1ed132c9dda5c82618635e6e910e", optional = true }
# Lifecycle FSM — Idle -> Planning -> Approving -> Applying -> Verifying
# -> Stable transitions tracked per reconcile so CR status reflects
# phase, and bundles carry the full transition history.
magma-fsm              = { git = "https://github.com/pleme-io/magma", rev = "af94559ea32f1ed132c9dda5c82618635e6e910e", optional = true }
# In-memory Pangea Ruby gem dependency tree owner. M0 parses
# Gemfile.lock + attests the closure; future M1-M5 materialize the
# tree end-to-end so bundle install vanishes from operator startup.
magma-rubygems         = { git = "https://github.com/pleme-io/magma", rev = "af94559ea32f1ed132c9dda5c82618635e6e910e", optional = true }
# BLAKE3-chained audit event stream + JsonLinesSink for durable
# audit logs. Captured during plan/apply and threaded into
# Bundle.audit per theory/CONVERGENCE-SUBSTRATE.md §IV.2.
magma-stream           = { git = "https://github.com/pleme-io/magma", rev = "af94559ea32f1ed132c9dda5c82618635e6e910e", optional = true }
hex                    = { version = "0.4", optional = true }

# Credential handling. See the workspace manifest for why each exists;
# the call sites are backend::config (providers.tf.json), controller::
# template_controller (the git askpass password file) and ruby::gem_cache
# (the gem-clone PAT).
cofre-fs = { workspace = true }
cofre-secret = { workspace = true }
base64 = { workspace = true }

# Kubernetes
kube = { workspace = true, features = ["runtime", "client"] }
k8s-openapi.workspace = true

# Async runtime
tokio = { workspace = true, features = ["signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"

# Drain coordinator — SIGTERM/SIGINT handling shared across pleme-io daemons
tsunagu = "0.1.5"

# Web framework
axum = { workspace = true, features = ["tokio"] }
tower.workspace = true
tower-http.workspace = true

# GraphQL (optional)
async-graphql = { workspace = true, features = ["chrono", "uuid"], optional = true }
async-graphql-axum = { workspace = true, optional = true }

# gRPC (optional)
# 0.12 -> 0.13 (2026-08-06): tonic 0.12.3 depends on `rustls-pemfile`
# (RUSTSEC-2025-0134, unmaintained, `patched: []`); 0.13.0 drops it. Kept in
# lockstep with magma, which made the same move for the same reason.
# Note the advisory was already only a LOCKFILE artifact here — this crate
# enables no tonic tls feature, so `cargo tree -i rustls-pemfile` matched
# nothing and it was never compiled. Bumping removes it from Cargo.lock
# outright, which is what cargo-audit actually reads.
tonic = { version = "0.13", optional = true }
prost = { version = "0.13", optional = true }
prost-types = "0.13"

# Database
sqlx = { workspace = true, features = ["tls-rustls", "chrono", "uuid"] }
# sqlx-macros-core depends on every driver (sqlite/mysql/postgres) for
# compile-time query verification, so sqlx-sqlite is built even though the
# operator only uses Postgres. sqlx-sqlite 0.8.6 needs libsqlite3-sys's full API
# (sqlite3_serialize / prepare_v3), absent from the pkg-config bindings. Force
# `bundled` so libsqlite3-sys compiles a vendored SQLite with the complete API.
# (Direct dep purely to set the feature via Cargo's feature unification.)
libsqlite3-sys = { version = "0.30", features = ["bundled"] }

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"

# Typed configuration surface — shikumi's tiered progressive-discovery
# fold (bare → discovered → prescribed_default → file → env → runtime) with
# per-leaf `Provenance`. `src/config.rs` implements `TieredConfig` over the
# operator's full env surface. figment is the Dict/Value builder for the
# discovered + env overlays (already transitive via shikumi; declared direct
# so the source of truth is clear). See ★★ CONFIGURATION MANAGEMENT.
shikumi = "0.1.496"
figment = "0.10"

# Observability
tracing.workspace = true
tracing-subscriber.workspace = true
# CURED 2026-08-13 — CVE-2026-48504 / GHSA-w9wp-h8wv-79jx (unbounded
# allocation parsing W3C Baggage headers) is gone from the lock. The four
# crates move in lockstep because they are one ecosystem and always were:
# tracing-opentelemetry 0.33 pairs with opentelemetry 0.32, exactly as 0.27
# paired with 0.26.
#
# THE FOUR MUST STAY IN LOCKSTEP. This is the real constraint and it is not
# a version-number convention: `tracing_opentelemetry::layer().with_tracer(t)`
# is generic over a Tracer trait that opentelemetry re-declares each minor
# release, so a mismatched pair fails with a bound error naming two types that
# LOOK identical. That is what broke the last attempted bump, and it is why
# the previous comment concluded the migration was expensive.
#
# It was not. The whole opentelemetry surface in this crate is ONE file --
# observability/tracing_setup.rs, two `.with_tracer()` calls and one
# `build_otlp_tracer` -- and 0.27→0.32 replaced the builder pipeline
# (`new_pipeline().install_batch()`) with an explicit
# `SdkTracerProvider::builder().with_batch_exporter()`. A real API change,
# confined to one function, found by reading the compiler rather than by
# predicting the ecosystem.
#
# The lesson worth keeping: "six minor releases away across an ecosystem with
# a history of breaking changes" priced the DEPENDENCY GRAPH, which is large,
# instead of the CALL SITE, which is one function. Price the call site.
tracing-opentelemetry = "0.33"
opentelemetry = { version = "0.32", features = ["trace"] }
# `tonic` → `grpc-tonic` at 0.32. `default-features = false` is deliberate:
# 0.32's defaults are ["http-proto", "reqwest-blocking-client", "trace",
# "metrics", "logs", "internal-logs"], so taking them compiles a whole second
# OTLP transport — the protobuf-over-HTTP encoder and a blocking HTTP client —
# beside the gRPC one this call site actually uses, plus the metrics and logs
# pipelines nothing here exports.
#
# Measured, because the tempting version of this claim is wrong: it does NOT
# remove reqwest from the closure. `cargo tree -i reqwest` shows exactly one
# parent and it is pangea-operator itself — reqwest is a direct dependency of
# this crate and stays. What the cut buys is that the unused HTTP transport is
# not COMPILED IN, and that opentelemetry-otlp stops being a second reason for
# the HTTP stack to be there — which matters the day the direct use goes away.
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
  "grpc-tonic",
  "trace",
] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
# `process` feature pulls in libc + procfs so the process_collector
# exports process_cpu_seconds_total / process_resident_memory_bytes /
# open FDs / threads. The collector module is gated by prometheus to
# `target_os = "linux"`, so registration is cfg-gated in metrics.rs
# (no-op on macOS dev hosts; live on the Linux operator pod).
#
# `default-features = false` (2026-07-18, GHSA-2gh3-rmm4-6rq5 /
# CVE-2025-53605): prometheus 0.13's `default = ["protobuf"]` pulls the
# `protobuf` crate pinned to `^2.0` — a line that was never patched for
# the uncontrolled-recursion advisory (only 3.7.2+ is fixed, and 0.13.x
# hard-caps at `^2.0`, so no `cargo update` alone can reach it). We only
# use `prometheus::TextEncoder` + the `Encoder` trait (metrics.rs) — no
# `ProtobufEncoder`, no `prometheus::proto` — so the protobuf-gated
# surface was dead weight. Disabling the default feature drops the
# `protobuf` dependency (and the CVE) from the graph entirely; `process`
# stays explicit since we do use process_collector.
prometheus = { version = "0.13", default-features = false, features = ["process"] }

# Stable cross-process hash for the anomaly_tracker module's
# error_signature primitive. Already transitively present via magma;
# adding as a direct dep so the source of truth is clear.
blake3 = "1"

# Direct rustls dep so main() can install a process-wide CryptoProvider.
# The executor_magma deps (tonic → rustls) feature-unify BOTH aws-lc-rs
# and ring, so rustls 0.23 can no longer auto-select; pick explicitly.
rustls = "0.23"


# Error handling
thiserror.workspace = true
anyhow.workspace = true

# SIGTERM-then-SIGKILL graceful shutdown for tofu apply timeouts.
# tokio::process::Child::kill only does SIGKILL; SIGKILL leaks the
# pg-backend advisory lock held by tofu. SIGTERM lets tofu flush
# state and release the lock cleanly before we escalate to SIGKILL
# at the 30-second grace boundary.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# HTTP client (for compiler sidecar)
reqwest.workspace = true

# Regex — used by the per-resource policy engine for `addressPattern`
# matching. Already pulled in transitively by tracing-subscriber et al.
regex = "1"

# In-process git. THE OPERATOR IMAGE SHIPS NO `git` AND NO `sh` (it is
# distroless-static), so every `Command::new("git")` ENOENTs at runtime —
# which is what froze every git-sourced template at its last-observed
# revision. The capability is embedded in the binary instead of added to
# the image: a linked library is not a subprocess, and this is the fleet's
# ★ NO SHELL law applied to its own control plane.
#
# Feature string copied VERBATIM from sui/Cargo.toml:296-304 rather than
# re-derived — `blocking-http-transport-reqwest-rust-tls` rides the
# reqwest+rustls already in this workspace (Cargo.toml:107), so no OpenSSL
# and no curl enter a distroless-static image. A wrong feature set builds
# clean on darwin and breaks only the musl-static leg.
#
# NOT git2: that is libgit2 (C) + OpenSSL, which under `pkgsStatic`
# (flake.nix:261-288) reintroduces the exact C-toolchain shape this change
# exists to remove.
gix = { version = "0.83", default-features = false, features = [
    "sha1",
    "blocking-network-client",
    "blocking-http-transport-reqwest-rust-tls",
    "worktree-mutation",
    "revision",
    "tree-editor",
] }

# Utilities
chrono = { workspace = true, features = ["serde"] }
cron.workspace = true
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
urlencoding = "2"
tempfile = "3"
rand = "0.8"
once_cell = "1"
derive_builder = "0.20"
strum = { version = "0.26", features = ["derive"] }
async-trait = "0.1"

# JSON Schema for CRDs
schemars.workspace = true
arc-swap = "1.9.1"

[build-dependencies]
# Lockstep with tonic above — tonic-build emits code against tonic's own API.
tonic-build = { version = "0.13", optional = true }
prost-build = { version = "0.13", optional = true }

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
rstest = "0.24"
pretty_assertions = "1"

[[bin]]
name = "pangea-operator"
path = "src/main.rs"
