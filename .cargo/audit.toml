# cargo-audit configuration — CLAIMS, not suppressions.
#
# Every entry below is a NAMED advisory with a stated reachability argument
# and the evidence for it. That is the fleet posture (hardened-images calls
# the same shape `cveClaims`): an advisory is claimed against a reason a
# reviewer can check and disagree with, never silenced because it is noisy.
#
# Adding a line here without an argument is the failure mode this file exists
# to prevent. If you cannot state why the code path is unreachable, upgrade
# instead — or leave it red and say so.
#
# Run:  cargo audit --file Cargo.lock
# State as of 2026-08-06: 3 advisories found, 1 FIXED by upgrade, 2 claimed.
#
#   RUSTSEC-2026-0185  quinn-proto 0.11.14  FIXED — bumped to 0.11.15.
#                      Not claimed, actually resolved. Purely transitive, and
#                      0.11.15's normal-dependency set is identical, so the
#                      lockfile bump is complete rather than partial.
#
# ── The two below are claimed. Both are argued from REACHABILITY, and both
# ── arguments are falsifiable — the recheck that would break each is stated.

[advisories]
ignore = [
  # ── RUSTSEC-2026-0189 · rmcp 0.15.0 · DNS rebinding ──────────────────────
  # Patched only in >= 1.4.0, a semver-MAJOR jump from the `"0.15"` range.
  #
  # The flaw is in rmcp's STREAMABLE HTTP server transport. This repo's only
  # rmcp consumer is `pangea-operator-mcp`, which enables exactly
  # `features = ["server", "transport-io"]` — stdio. The streamable-http
  # transport is not compiled in, so there is no HTTP listener to rebind
  # against. A prior reviewer reached the same conclusion independently on
  # 2026-07-18 and recorded it at pangea-operator-mcp/Cargo.toml:19-35,
  # verified there against both rmcp's feature graph and the resolved
  # Cargo.lock dependency list.
  #
  # WHAT WOULD FALSIFY THIS: any consumer enabling `transport-streamable-http`
  # (or rmcp gaining an HTTP listener under a feature already enabled here).
  # Grep before trusting this line:
  #   grep -rn 'transport-streamable-http\|StreamableHttp' --include='*.rs' --include='Cargo.toml'
  # REVISIT: on a scoped rmcp 1.x bump — that is the real fix, this is the
  # holding position until the major upgrade is scheduled.
  "RUSTSEC-2026-0189",

  # ── RUSTSEC-2023-0071 · rsa 0.9.10 · Marvin Attack (timing sidechannel) ──
  # `patched: []` — THERE IS NO FIXED VERSION. Upgrading is not an option
  # anyone has; this cannot be resolved by a bump today.
  #
  # Path into the graph (from cargo-audit's own tree):
  #   rsa <- sqlx-mysql <- {sqlx-macros-core <- sqlx-macros <- sqlx, sqlx}
  #
  # Two independent reasons the vulnerable path is not exercised:
  #  1. sqlx is configured `default-features = false` with
  #     `["macros","migrate","json","postgres","runtime-tokio"]`
  #     (Cargo.toml:125) — the `mysql` driver feature is NOT enabled.
  #  2. No MySQL is used anywhere in the tree: a repo-wide grep for
  #     `MySql|mysql` across *.rs returns nothing. The attack recovers an RSA
  #     key through timing during MySQL's auth handshake; with no MySQL
  #     connection there is no handshake to time.
  # The lockfile entry exists because Cargo.lock enumerates the full possible
  # graph regardless of feature activation, and because sqlx-macros (a
  # PROC-MACRO crate, host-side and build-time) pulls the driver set for
  # compile-time query checking.
  #
  # UPGRADED FROM ARGUED TO MEASURED (2026-08-06). This entry previously
  # recorded an honest limit: that `cargo tree -e normal -i rsa` — the check
  # that would settle runtime-dep vs build-time-proc-macro-dep outright —
  # could not be run here, because it needs network access to the private
  # pangea provider dependencies. That access was obtained (cargo can reach
  # them over SSH by rewriting the https git URLs), so the check was run:
  #
  #   cargo tree -e normal --target all -i rsa   -> "nothing to print"
  #   cargo tree            --target all -i rsa   -> "nothing to print"
  #
  # The second form includes build and proc-macro edges, so this is stronger
  # than the original claim: rsa is not in the resolved dependency graph AT
  # ALL. It is not linked, and it is not even compiled host-side. Its presence
  # is purely a Cargo.lock artifact, because the lock enumerates optional
  # dependencies (sqlx's mysql driver) regardless of feature activation.
  # Positive control run in the same session so "nothing to print" is not read
  # as a broken invocation: `-i anyhow` prints its tree.
  #
  # WHAT WOULD FALSIFY THIS: enabling sqlx's `mysql` feature, or any MySQL
  # connection appearing in the codebase. Either makes this immediately
  # exploitable-in-principle and there is still no patch to take.
  "RUSTSEC-2023-0071",
]
