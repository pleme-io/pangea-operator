[package]
name = "pangea-types"
version = "0.1.0"
edition = "2021"
authors = ["Pleme <engineering@pleme.io>"]
description = "Shared types for Pangea infrastructure management platform"
license = "Apache-2.0"
repository = "https://github.com/pleme-io/nexus"

[features]
default = []
# Server-side features (async-graphql derives)
server = ["async-graphql"]
# Client-side features (cynic derives)
client = ["cynic"]

[dependencies]
# Serialization (always needed)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time handling
chrono = { version = "0.4", features = ["serde"], default-features = false }

# GraphQL server (optional)
async-graphql = { version = "7", optional = true }

# GraphQL client (optional)
cynic = { version = "3", optional = true }

# Kubernetes (for CRD types)
# Version-locked to the workspace kube ON PURPOSE. This is spelled out rather
# than `workspace = true` so the feature set stays lean (derive only — this
# crate defines CRD types and needs no client or runtime), but the VERSION must
# track the workspace or cargo resolves two semver-incompatible kubes into one
# graph. It did exactly that when the workspace moved to 0.99 and this line was
# missed: kube 0.98 and 0.99 both present, meaning two distinct `Resource`
# traits, with the derive here impl'ing the 0.98 one while the operator consumes
# it through 0.99. Keep this number equal to the workspace's.
kube = { version = "0.99", features = ["derive"], default-features = false }
k8s-openapi = { version = "0.24", features = ["v1_31"] }
schemars = "0.8"
