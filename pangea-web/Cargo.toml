[package]
name = "pangea-web"
version = "0.1.0"
edition = "2021"
authors = ["Pleme <engineering@pleme.io>"]
description = "Web UI for Pangea infrastructure management"
license = "Apache-2.0"
repository = "https://github.com/pleme-io/nexus"

# Standalone workspace (not part of main pangea workspace)
# Built separately with WASM toolchain
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Yew framework
yew = { version = "0.21", features = ["csr"] }
yew-router = "0.18"

# GraphQL client
cynic = { version = "3", features = ["http-reqwest"] }
gloo-net = "0.5"
gloo-timers = "0.3"
gloo-storage = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async / WASM
# Pinned to match nixpkgs wasm-bindgen-cli version
wasm-bindgen = "=0.2.105"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "Storage",
] }

# Logging
log = "0.4"
wasm-logger = "0.2"

# Time handling
chrono = { version = "0.4", features = ["wasmbind", "serde"], default-features = false }

[build-dependencies]
cynic-codegen = "3"
